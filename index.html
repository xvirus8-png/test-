<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>فيروز - طلبية</title>

<style>
  :root{
    --ink:#1c1c1c;
    --paper:#fbfaf7;
    --line:#d8d3c8;
    --accent:#b5442e;
    --accent2:#2f6b52;
    --gold:#a8863b;
    --soft:#f1ede3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, sans-serif;
    background:var(--soft);
    color:var(--ink);
    padding-bottom:90px;
    -webkit-user-select:none;
    -moz-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  input{
    -webkit-user-select:text;
    -moz-user-select:text;
    user-select:text;
  }
  header{
    position:fixed;top:0;left:0;right:0;z-index:50;
    background:var(--ink);
    color:#fff;
    padding:10px 14px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  header h1{font-size:16px;margin:0;flex:1;font-weight:700;letter-spacing:.5px;}
  .totals{
    display:flex;gap:14px;font-size:13px;background:rgba(255,255,255,.08);
    padding:6px 12px;border-radius:8px;
  }
  .totals b{color:var(--gold);font-size:15px;}
  .tabs{
    display:flex;gap:6px;overflow-x:auto;background:#fff;
    padding:8px 10px;position:sticky;top:58px;z-index:49;
    border-bottom:1px solid var(--line);
    margin-top:58px;
  }
  .tab-btn{
    flex:none;padding:8px 16px;border-radius:20px;border:1px solid var(--line);
    background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:#555;
    white-space:nowrap;
  }
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .search-bar{padding:10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:154px;z-index:48;}
  .customer-bar{padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:108px;z-index:48;}
  .customer-bar input{
    width:100%;padding:8px 12px;border-radius:8px;border:1.5px solid var(--gold);
    font-size:14px;font-weight:700;background:#fffaf0;
  }
  .search-bar input{
    width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);
    font-size:14px;background:var(--paper);
  }
  main{padding:12px;max-width:1200px;margin:0 auto;}
  .brand-panel{display:none;}
  .brand-panel.active{display:block;}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:10px;
  }
  .block{
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:10px;position:relative;transition:box-shadow .15s;
  }
  .block.has-qty{box-shadow:0 0 0 2px var(--accent2);}
  .block-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;}
  .block-head img{width:100px;height:100px;object-fit:cover;border-radius:7px;border:1px solid var(--line);background:#f4f4f4;cursor:zoom-in;display:block;}
  .product-img-wrap{display:flex;align-items:center;gap:7px;min-width:100px;}
  .product-img-wrap .img-upload{display:none;}
  .product-img-btn{background:var(--gold);color:#fff;border:none;border-radius:6px;padding:5px 7px;font-size:11px;font-weight:700;cursor:pointer;}
  .product-img-btn:active{transform:scale(.96);}
  .image-lightbox{
    position:fixed;inset:0;z-index:99999;
    background:rgba(0,0,0,.82);
    display:flex;align-items:center;justify-content:center;
    padding:20px;cursor:zoom-out;
  }
  .image-lightbox img{
    max-width:92vw;max-height:88vh;
    width:auto;height:auto;
    object-fit:contain;border-radius:12px;
    box-shadow:0 8px 35px rgba(0,0,0,.45);
  }
  .image-lightbox .close-image{
    position:absolute;top:18px;right:18px;
    width:42px;height:42px;border:none;border-radius:50%;
    background:#fff;color:#222;font-size:24px;font-weight:800;
    cursor:pointer;
  }
  .edit-image-cell{min-width:100px;}
  .edit-image-preview{width:42px;height:42px;object-fit:cover;border-radius:6px;border:1px solid var(--line);vertical-align:middle;background:#f4f4f4;margin-inline-end:5px;}
  .block-head .code{font-weight:800;font-size:14px;}
  .prices{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;direction:rtl;margin-top:0;}
  .price-line{font-size:13px;font-weight:700;white-space:nowrap;line-height:1.25;}
  .price-line .price-label{margin-inline-end:4px;}
  .wholesale-price{color:#17833b;}
  .retail-price{color:#1769aa;}
  .price-line strong{font-size:16px;letter-spacing:.2px;}
  .barcode-input{direction:ltr;text-align:center;min-width:120px;} 
  .barcode-preview{font-family:monospace;font-size:11px;letter-spacing:1px;color:#555;}margin-inline-start:auto;display:flex;align-items:baseline;gap:6px;}
  .price-big{font-size:15px;font-weight:800;color:var(--accent);}
  .price-small{font-size:12px;font-weight:600;color:#888;}
  .rows{display:grid;grid-template-columns:1fr;gap:6px;}
  .row-item{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--paper);border-radius:6px;padding:4px 6px;font-size:12px;
    border:1px solid transparent;
  }
  .row-item.filled{border-color:var(--accent2);background:#eef7f1;}
  .row-item label{font-weight:700;color:#555;}
  .row-item input{
    width:34px;text-align:center;border:1px solid var(--line);border-radius:5px;
    padding:3px 2px;font-size:13px;
  }
  .qty-ctrl{display:flex;align-items:center;gap:6px;}
  .qty-ctrl button{
    width:30px;height:30px;line-height:1;border:none;border-radius:7px;
    background:var(--accent2);font-weight:900;font-size:18px;cursor:pointer;color:#fff;padding:0;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  .qty-ctrl button.btn-dec{background:#b5442e;}
  .qty-ctrl button:active{transform:scale(.92);}
  .brand-title{
    font-size:20px;font-weight:800;text-align:center;margin:10px 0 14px;
    color:var(--accent);
  }
  footer.bar{
    position:fixed;bottom:0;left:0;right:0;background:#fff;
    border-top:1px solid var(--line);padding:10px 14px;
    display:flex;gap:10px;box-shadow:0 -2px 10px rgba(0,0,0,.1);z-index:60;
  }
  footer.bar button{
    flex:1;padding:12px;border-radius:9px;border:none;font-weight:800;font-size:14px;cursor:pointer;
  }
  .btn-export{background:var(--accent2);color:#fff;}
  .btn-clear{background:#eee;color:#900;}
  .hint{font-size:12px;color:#999;text-align:center;padding:20px;}
  .edit-price-btn{
    background:var(--gold);color:#fff;border:none;border-radius:5px;
    width:22px;height:22px;font-size:12px;cursor:pointer;margin-inline-start:4px;
  }
  .add-block-btn{
    display:block;margin:0 auto 12px;background:var(--accent2);color:#fff;border:none;
    padding:8px 16px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;
  }
  .add-item-btn, .del-block-btn{
    margin-top:8px;border:none;border-radius:6px;padding:5px 8px;font-size:11px;
    font-weight:700;cursor:pointer;
  }
  .add-item-btn{background:var(--accent2);color:#fff;}
  .del-block-btn{background:#c0392b;color:#fff;margin-inline-start:6px;}
  body.edit-mode .block{outline:1px dashed var(--gold);}
  .edit-toolbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:10px;margin-bottom:14px;
  }
  .edit-toolbar .import-btn, .edit-toolbar #exportExcelBtn{
    background:var(--accent2);color:#fff;border:none;border-radius:8px;
    padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;
  }
  .edit-toolbar #exportExcelBtn{background:var(--gold);}
  .edit-hint{font-size:12px;color:#888;}
  table.price-table{
    width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;
    margin-bottom:10px;
  }
  table.price-table th{
    background:var(--ink);color:#fff;padding:8px;font-size:13px;text-align:center;
  }
  table.price-table td{
    border-bottom:1px solid var(--line);padding:6px;text-align:center;
  }
  table.price-table input{
    width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:13px;
    text-align:center;
  }
  table.price-table .code-input{text-align:right;font-weight:700;}
  table.price-table .row-del{
    background:#c0392b;color:#fff;border:none;border-radius:6px;
    width:28px;height:28px;cursor:pointer;font-size:13px;
  }
  .add-row-btn{
    display:block;margin:0 auto 20px;background:var(--accent2);color:#fff;border:none;
    padding:9px 18px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;
  }
  #exportCanvas{padding:16px;background:#fff;}
  .exp-block{border:1px solid #333;padding:6px;margin-bottom:8px;border-radius:4px;}
  .exp-header{font-weight:800;border-bottom:2px solid var(--accent);margin-bottom:10px;padding-bottom:6px;}
</style>
</head>
<body>

<header>
  <h1>📋 فيروز</h1>
  <div class="totals">
    <span>القطع: <b id="totalPieces">0</b></span>
    <span>المبلغ: <b id="totalAmount">0</b></span>
  </div>
  <button id="editBtn" onclick="toggleEditMode()" style="background:#a8863b;color:#fff;border:none;padding:7px 12px;border-radius:7px;font-weight:700;font-size:12px;cursor:pointer;">✎ تعديل الأسعار</button>
</header>

<div class="tabs" id="tabs"></div>
<div class="customer-bar">
  <input id="customerName" placeholder="✏️ اسم الزبون">
</div>
<div class="search-bar"><input id="searchBox" placeholder="ابحث بالكود... مثال: LMM, GT, NG"></div>

<main id="main"></main>

<footer class="bar">
  <button class="btn-clear" onclick="clearAll()">مسح الكل</button>
  <button class="btn-export" onclick="exportOrder()">📤 تصدير الطلبية</button>
</footer>

  localStorage.setItem(LS_QTY_KEY, JSON.stringify(QTY));
}

function parsePrices(priceStr){
  if(!priceStr || priceStr.trim()==="-") return {big:0, small:0};
  const parts = priceStr.split("/").map(s=>{
    // Source sheet uses "." as a THOUSANDS separator (e.g. 15.000 = 15000), not decimal.
    const clean = s.trim().replace(/,/g,"").replace(/\./g,"");
    return parseFloat(clean);
  });
  const valid = parts.filter(n=>!isNaN(n));
  if(!valid.length) return {big:0, small:0};
  return { big: Math.max(...valid), small: Math.min(...valid) };
}
function fmt(n){
  if(!n) return "0";
  return n.toLocaleString("en-US", {maximumFractionDigits:3});
}

function buildTabs(){

function getProductImage(block){
  return block && block.image ? block.image : "";
}

function imagePlaceholder(){
  return `<div style="width:52px;height:52px;border-radius:7px;border:1px solid var(--line);background:#f4f4f4;display:flex;align-items:center;justify-content:center;font-size:22px;">📦</div>`;
}


function showProductImage(src){
  if(!src) return;

  const overlay = document.createElement("div");
  overlay.className = "image-lightbox";
  overlay.innerHTML = `
    <button type="button" class="close-image" aria-label="إغلاق">×</button>
    <img src="${src}" alt="صورة المنتج">
  `;

  const close = ()=>{
    overlay.remove();
    document.removeEventListener("keydown", onKey);
  };
  const onKey = (e)=>{
    if(e.key === "Escape") close();
  };

  overlay.addEventListener("click", (e)=>{
    if(e.target === overlay) close();
  });
  overlay.querySelector(".close-image").addEventListener("click", close);

  document.addEventListener("keydown", onKey);
  document.body.appendChild(overlay);
}

function chooseProductImage(brand, block, onDone){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.style.display = "none";

  input.addEventListener("change", ()=>{
    const file = input.files && input.files[0];
    if(!file) return;

    // Resize before saving to localStorage so product images don't consume excessive space.
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxSize = 700;
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        block.image = canvas.toDataURL("image/jpeg", 0.78);
        saveData();
        if(onDone) onDone();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  document.body.appendChild(input);
  input.click();
  setTimeout(()=>input.remove(), 1000);
}

function buildGrid(grid, brand, blocks){
  blocks.forEach(block=>{
    if(!QTY[brand][block.code]) QTY[brand][block.code] = {};
    const {big, small} = parsePrices(block.price);
    const el = document.createElement("div");
    el.className = "block";
    el.dataset.code = block.code.toLowerCase();
    el.innerHTML = `
      <div class="block-head">
        <div class="product-img-wrap">
          ${getProductImage(block) ? `<img src="${getProductImage(block)}" class="product-image" title="اضغط لتغيير الصورة">` : imagePlaceholder()}
          ${editMode ? `<button type="button" class="product-img-btn">📷 صورة</button>` : ""}
        </div>
        <div class="code">${block.code}</div>
        <div class="prices">
          <div class="price-line wholesale-price"><span class="price-label">سعر المفرد :</span><strong>${fmt(big)}</strong></div>
          <div class="price-line retail-price"><span class="price-label">سعر الجمله :</span><strong>${fmt(small)}</strong></div>
        </div>
      </div>
      <div class="rows"></div>
    `;
    const rows = el.querySelector(".rows");

    if(editMode){
      const imgBtn = el.querySelector(".product-img-btn");
      if(imgBtn){
        imgBtn.addEventListener("click", ()=>{
          chooseProductImage(brand, block, ()=>buildPanels());
        });
      }
      const img = el.querySelector(".product-image");
      if(img){
        img.onclick = (e)=>{
          e.preventDefault();
          e.stopPropagation();
          if(editMode){
            chooseProductImage(brand, block, ()=>buildPanels());
          } else {
            showProductImage(img.src);
          }
        };
      }
    }

    block.items.forEach(item=>{
      const row = document.createElement("div");
      row.className = "row-item";
      const savedQty = QTY[brand][block.code][item] || 0;
      row.innerHTML = `<label>${item}</label><div class="qty-ctrl"><button type="button" class="btn-dec">−</button><input type="number" min="0" inputmode="numeric" placeholder="0" value="${savedQty>0?savedQty:''}"><button type="button" class="btn-inc">+</button></div>`;
      const input = row.querySelector("input");
      if(savedQty>0) row.classList.add("filled");
      const applyChange = ()=>{
        const val = parseInt(input.value)||0;
        if(val>0){
          QTY[brand][block.code][item] = val;
          row.classList.add("filled");
        } else {
          delete QTY[brand][block.code][item];
          row.classList.remove("filled");
        }
        el.classList.toggle("has-qty", Object.keys(QTY[brand][block.code]).length>0);
        saveQty();
        updateTotals();
      };
      input.addEventListener("input", applyChange);
      row.querySelector(".btn-inc").addEventListener("click", ()=>{
        input.value = (parseInt(input.value)||0) + 1;
        applyChange();
      });
      row.querySelector(".btn-dec").addEventListener("click", ()=>{
        const v = (parseInt(input.value)||0) - 1;
        input.value = v > 0 ? v : "";
        applyChange();
      });
      rows.appendChild(row);
    });
    if(Object.keys(QTY[brand][block.code]).length>0){
      el.classList.add("has-qty");
    }
    grid.appendChild(el);
  });
}

function handleImportExcel(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const wb = XLSX.read(ev.target.result, {type:"array"});
      wb.SheetNames.forEach(sheetName=>{
        const brand = Object.keys(DATA).find(b=>b.toLowerCase()===sheetName.toLowerCase()) || sheetName;
        if(!DATA[brand]) DATA[brand] = [];
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1});
        rows.slice(1).forEach(row=>{ // skip header row
          const [code, jumla, mfrad] = row;
          if(!code) return;
          const codeStr = String(code).trim();
          const s = parseFloat(jumla)||0;
          const b = parseFloat(mfrad)||0;
          const existing = DATA[brand].find(bl=>bl.code.toLowerCase()===codeStr.toLowerCase());
          if(existing){
            existing.price = `${b}/${s}`;
          } else {
            DATA[brand].push({code: codeStr, price:`${b}/${s}`, items:["-"]});
          }
        });
      });
      saveData();
      buildTabs();
      buildPanels();
      alert("تم الاستيراد بنجاح ✅");
    }catch(err){
      alert("صار خطأ بالاستيراد، تأكد من شكل ملف الاكسل");
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = "";
}

function exportExcel(){
  const wb = XLSX.utils.book_new();
  Object.entries(DATA).forEach(([brand, blocks])=>{
    const aoa = [["الكود","مبلغ الجملة","مبلغ المفرد"]];
    blocks.forEach(b=>{
      const {big, small} = parsePrices(b.price);
      aoa.push([b.code, small, big]);
    });
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, brand.slice(0,31));
  });
  XLSX.writeFile(wb, `products_${Date.now()}.xlsx`);
}

function updateTotals(){
  let pieces=0, amount=0;
  Object.entries(QTY).forEach(([brand, codes])=>{
    Object.entries(codes).forEach(([code, items])=>{
      const block = (DATA[brand]||[]).find(b=>b.code===code);
      const price = block ? parsePrices(block.price).small : 0;
      Object.values(items).forEach(qty=>{
        pieces += qty;
        amount += qty * price;
      });
    });
  });
  document.getElementById("totalPieces").textContent = pieces;
  document.getElementById("totalAmount").textContent = fmt(amount);
}

  container.id = "exportCanvas";
  container.style.width = "800px";
  container.style.fontFamily = "Tahoma, sans-serif";
  container.style.direction = "rtl";

  const customerName = document.getElementById("customerName").value.trim();
  let html = `<h2 style="text-align:center;border-bottom:3px solid #b5442e;padding-bottom:10px;">طلبية - ${new Date().toLocaleDateString('ar-IQ')}</h2>`;
  if(customerName){
    html += `<h3 style="text-align:center;color:#2f6b52;margin-top:-6px;">الزبون: ${customerName}</h3>`;
  }

  Object.entries(QTY).forEach(([brand, codes])=>{
    const entries = Object.entries(codes).filter(([c,items])=>Object.keys(items).length>0);
    if(!entries.length) return;
    html += `<div class="exp-header" style="margin-top:14px;">${brand}</div>`;
    html += `<table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px;">
      <tr style="background:#f1ede3;"><th style="border:1px solid #ccc;padding:4px;">الصورة / الباركود</th><th style="border:1px solid #ccc;padding:4px;">الكود</th><th style="border:1px solid #ccc;padding:4px;">الدرجة</th><th style="border:1px solid #ccc;padding:4px;">الكمية</th><th style="border:1px solid #ccc;padding:4px;">السعر</th><th style="border:1px solid #ccc;padding:4px;">المجموع</th></tr>`;
    entries.forEach(([code, items])=>{
      const block = (DATA[brand]||[]).find(b=>b.code===code);
      const price = block ? parsePrices(block.price).small : 0;
      Object.entries(items).forEach(([label, qty])=>{
        html += `<tr>
          <td style="border:1px solid #ccc;padding:4px;text-align:center;">${block && block.image ? `<img src="${block.image}" style="width:38px;height:38px;object-fit:cover;border-radius:4px;">` : "📦"}${block && block.barcode ? `<svg class="invoice-barcode" data-barcode="${block.barcode}" style="width:105px;height:34px;display:block;margin:3px auto 0;"></svg>` : ""}</td>
          <td style="border:1px solid #ccc;padding:4px;text-align:center;">${code}</td>
          <td style="border:1px solid #ccc;padding:4px;text-align:center;">${label}</td>
          <td style="border:1px solid #ccc;padding:4px;text-align:center;">${qty}</td>
          <td style="border:1px solid #ccc;padding:4px;text-align:center;">${fmt(price)}</td>
          <td style="border:1px solid #ccc;padding:4px;text-align:center;">${fmt(qty*price)}</td>
        </tr>`;
      });
    });
    html += `</table>`;
  });

  html += `<h3 style="text-align:left;border-top:2px solid #333;padding-top:8px;">الإجمالي: ${document.getElementById("totalAmount").textContent} | القطع: ${document.getElementById("totalPieces").textContent}</h3>`;

  container.innerHTML = html;
  container.style.position = "fixed";
  container.style.left = "-9999px";
  document.body.appendChild(container);

  const canvas = await html2canvas(container, {scale:2, backgroundColor:"#ffffff"});
  document.body.removeChild(container);

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:"mm", format:"a4"});
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const imgWidth = pageWidth;
  const imgHeight = (canvas.height * imgWidth) / canvas.width;
  const imgData = canvas.toDataURL("image/png");

  let heightLeft = imgHeight;
  let position = 0;

  pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
  heightLeft -= pageHeight;

  while(heightLeft > 0){
    position = heightLeft - imgHeight;
    pdf.addPage();
    pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
  }

  const safeName = customerName ? customerName.replace(/[^a-zA-Z0-9ء-ي_ -]/g,"").trim().replace(/\s+/g,"_") : "";
  pdf.save(`order_${safeName ? safeName+"_" : ""}${Date.now()}.pdf`);
}

buildTabs();
buildPanels();
updateTotals();

// Fallback: clicking any product image always opens the enlarged image
// when not in edit mode. This also works after the cards are re-rendered.
document.addEventListener("click", (e)=>{
  const img = e.target.closest(".product-image");
  if(!img || editMode) return;
  e.preventDefault();
  e.stopPropagation();
  showProductImage(img.currentSrc || img.src);
}, true);

// Customer name persistence
const customerInput = document.getElementById("customerName");
customerInput.value = localStorage.getItem(LS_CUSTOMER_KEY) || "";
customerInput.addEventListener("input", ()=>{
  localStorage.setItem(LS_CUSTOMER_KEY, customerInput.value);
});

// Prevent pinch-zoom and double-tap zoom
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("gesturechange", e => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if(now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, {passive:false});
document.addEventListener("touchmove", e => {
  if(e.touches.length > 1) e.preventDefault();
}, {passive:false});
</script>
</body>
</html>
