<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>فيروز - طلبية</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1c1c1c;
    --paper:#fbfaf7;
    --line:#d8d3c8;
    --accent:#b5442e;
    --accent2:#2f6b52;
    --gold:#a8863b;
    --soft:#f1ede3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, sans-serif;
    background:var(--soft);
    color:var(--ink);
    padding-bottom:90px;
    -webkit-user-select:none;
    -moz-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  input{
    -webkit-user-select:text;
    -moz-user-select:text;
    user-select:text;
  }
  header{
    position:fixed;top:0;left:0;right:0;z-index:50;
    background:var(--ink);
    color:#fff;
    padding:10px 14px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  header h1{font-size:16px;margin:0;flex:1;font-weight:700;letter-spacing:.5px;}
  .totals{
    display:flex;gap:14px;font-size:13px;background:rgba(255,255,255,.08);
    padding:6px 12px;border-radius:8px;
  }
  .totals b{color:var(--gold);font-size:15px;}
  .tabs{
    display:flex;gap:6px;overflow-x:auto;background:#fff;
    padding:8px 10px;position:sticky;top:58px;z-index:49;
    border-bottom:1px solid var(--line);
    margin-top:58px;
  }
  .tab-btn{
    flex:none;padding:8px 16px;border-radius:20px;border:1px solid var(--line);
    background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:#555;
    white-space:nowrap;
  }
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .search-bar{padding:10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:154px;z-index:48;}
  .customer-bar{padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:108px;z-index:48;}
  .customer-bar input{
    width:100%;padding:8px 12px;border-radius:8px;border:1.5px solid var(--gold);
    font-size:14px;font-weight:700;background:#fffaf0;
  }
  .search-bar input{
    width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);
    font-size:14px;background:var(--paper);
  }
  main{padding:12px;max-width:1200px;margin:0 auto;}
  .brand-panel{display:none;}
  .brand-panel.active{display:block;}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:10px;
  }
  .block{
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:10px;position:relative;transition:box-shadow .15s;
  }
  .block.has-qty{box-shadow:0 0 0 2px var(--accent2);}
  .block-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;}
  .block-head img{width:100px;height:100px;object-fit:contain;border-radius:7px;border:1px solid var(--line);background:#f4f4f4;cursor:zoom-in;display:block;}
  .product-img-wrap{display:flex;align-items:center;gap:7px;min-width:100px;}
  .product-img-wrap .img-upload{display:none;}
  .product-img-btn{background:var(--gold);color:#fff;border:none;border-radius:6px;padding:5px 7px;font-size:11px;font-weight:700;cursor:pointer;}
  .product-img-btn:active{transform:scale(.96);}
  .image-lightbox{
    position:fixed;inset:0;z-index:99999;
    background:rgba(0,0,0,.82);
    display:flex;align-items:center;justify-content:center;
    padding:20px;cursor:zoom-out;
  }
  .image-lightbox img{
    max-width:92vw;max-height:88vh;
    width:auto;height:auto;
    object-fit:contain;border-radius:12px;
    box-shadow:0 8px 35px rgba(0,0,0,.45);
  }
  .image-lightbox .close-image{
    position:absolute;top:18px;right:18px;
    width:42px;height:42px;border:none;border-radius:50%;
    background:#fff;color:#222;font-size:24px;font-weight:800;
    cursor:pointer;
  }
  .edit-image-cell{min-width:100px;}
  .edit-image-preview{width:42px;height:42px;object-fit:contain;border-radius:6px;border:1px solid var(--line);vertical-align:middle;background:#f4f4f4;margin-inline-end:5px;}
  .block-head .code{font-weight:800;font-size:14px;}
  .prices{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;direction:rtl;margin-top:0;}
  .price-line{font-size:13px;font-weight:700;white-space:nowrap;line-height:1.25;}
  .price-line .price-label{margin-inline-end:4px;}
  .wholesale-price{color:#17833b;}
  .retail-price{color:#1769aa;}
  .price-line strong{font-size:16px;letter-spacing:.2px;}
  .barcode-input{direction:ltr;text-align:center;min-width:120px;}
  .items-input{min-width:140px;}
  .barcode-preview{font-family:monospace;font-size:11px;letter-spacing:1px;color:#555;margin-inline-start:auto;display:flex;align-items:baseline;gap:6px;}
  .price-big{font-size:15px;font-weight:800;color:var(--accent);}
  .price-small{font-size:12px;font-weight:600;color:#888;}
  .rows{display:grid;grid-template-columns:1fr;gap:6px;}
  .row-item{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--paper);border-radius:6px;padding:4px 6px;font-size:12px;
    border:1px solid transparent;
  }
  .row-item.filled{border-color:var(--accent2);background:#eef7f1;}
  .row-item label{font-weight:700;color:#555;}
  .variant-label{cursor:pointer;}
  .variant-label.has-image{color:var(--accent2);text-decoration:underline dotted;}
  .variant-label.has-image::after{content:" 🖼";font-size:11px;}
  .open-items-btn{
    background:var(--soft);border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;font-weight:700;font-size:12px;cursor:pointer;color:var(--ink);
  }
  .variants-modal{
    position:fixed;inset:0;background:rgba(21,37,36,.55);z-index:200;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .variants-panel{
    background:#fff;width:100%;max-width:600px;max-height:85vh;
    border-radius:16px 16px 0 0;display:flex;flex-direction:column;
    box-shadow:0 -4px 20px rgba(0,0,0,.25);
  }
  .variants-panel-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid var(--line);
  }
  .variants-panel-title{font-weight:800;font-size:15px;}
  .close-variants{
    background:var(--soft);border:none;border-radius:50%;
    width:30px;height:30px;font-size:18px;cursor:pointer;color:var(--ink);
  }
  .variants-list{overflow-y:auto;padding:10px 14px;flex:1;}
  .variant-row{
    display:flex;align-items:center;gap:10px;
    padding:9px 4px;border-bottom:1px solid var(--soft);
  }
  .variant-row label{flex:1;font-weight:700;font-size:14px;}
  .variant-thumb{
    width:44px;height:44px;flex:none;border-radius:8px;border:1px solid var(--line);
    background:var(--soft);cursor:pointer;overflow:hidden;
    display:flex;align-items:center;justify-content:center;font-size:16px;
  }
  .variant-thumb img{width:100%;height:100%;object-fit:contain;}
  .variant-del{
    background:#c0392b;color:#fff;border:none;border-radius:6px;
    width:30px;height:30px;font-size:13px;cursor:pointer;flex:none;
  }
  .add-item-bar{
    display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);
  }
  .add-item-bar input{
    flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px;
  }
  .add-item-bar button{
    background:var(--accent2);color:#fff;border:none;border-radius:8px;
    padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;
  }
  .cloud-modal{
    position:fixed;inset:0;background:rgba(21,37,36,.55);z-index:210;
    display:flex;align-items:center;justify-content:center;padding:16px;
  }
  .cloud-panel{
    background:#fff;width:100%;max-width:480px;border-radius:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.3);overflow:hidden;max-height:92vh;overflow-y:auto;
  }
  .cloud-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:15px;
  }
  .close-cloud{
    background:var(--soft);border:none;border-radius:50%;
    width:30px;height:30px;font-size:18px;cursor:pointer;color:var(--ink);
  }
  .cloud-body{padding:14px 16px;display:flex;flex-direction:column;gap:9px;}
  .cloud-body label{font-size:12px;font-weight:700;color:#555;}
  .cloud-body input{
    border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px;width:100%;
  }
  .cloud-status{font-size:13px;font-weight:700;padding:7px 10px;border-radius:7px;background:var(--soft);}
  .cloud-status.on{background:#e8f5ec;color:#1e7a3c;}
  .cloud-status.error{background:#fdecea;color:#b02a1d;}
  .cloud-body button{
    background:var(--accent2);color:#fff;border:none;border-radius:8px;
    padding:11px;font-weight:800;font-size:14px;cursor:pointer;
  }
  .cloud-body button.danger{background:#eee;color:#900;}
  .cloud-help{margin-top:4px;background:var(--soft);border-radius:8px;padding:10px;font-size:12px;color:#444;line-height:1.8;}
  .cloud-help summary{font-weight:700;cursor:pointer;color:var(--accent2);}
  .cloud-note{font-size:11px;color:#888;line-height:1.6;}
  .row-item input{
    width:34px;text-align:center;border:1px solid var(--line);border-radius:5px;
    padding:3px 2px;font-size:13px;
  }
  .qty-ctrl{display:flex;align-items:center;gap:6px;}
  .qty-ctrl button{
    width:30px;height:30px;line-height:1;border:none;border-radius:7px;
    background:var(--accent2);font-weight:900;font-size:18px;cursor:pointer;color:#fff;padding:0;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  .qty-ctrl button.btn-dec{background:#b5442e;}
  .qty-ctrl button:active{transform:scale(.92);}
  .brand-title{
    font-size:20px;font-weight:800;text-align:center;margin:10px 0 14px;
    color:var(--accent);
  }
  footer.bar{
    position:fixed;bottom:0;left:0;right:0;background:#fff;
    border-top:1px solid var(--line);padding:10px 14px;
    display:flex;gap:10px;box-shadow:0 -2px 10px rgba(0,0,0,.1);z-index:60;
  }
  footer.bar button{
    flex:1;padding:12px;border-radius:9px;border:none;font-weight:800;font-size:14px;cursor:pointer;
  }
  .btn-export{background:var(--accent2);color:#fff;}
  .btn-clear{background:#eee;color:#900;}
  .hint{font-size:12px;color:#999;text-align:center;padding:20px;}
  .edit-price-btn{
    background:var(--gold);color:#fff;border:none;border-radius:5px;
    width:22px;height:22px;font-size:12px;cursor:pointer;margin-inline-start:4px;
  }
  .add-block-btn{
    display:block;margin:0 auto 12px;background:var(--accent2);color:#fff;border:none;
    padding:8px 16px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;
  }
  .add-item-btn, .del-block-btn{
    margin-top:8px;border:none;border-radius:6px;padding:5px 8px;font-size:11px;
    font-weight:700;cursor:pointer;
  }
  .add-item-btn{background:var(--accent2);color:#fff;}
  .del-block-btn{background:#c0392b;color:#fff;margin-inline-start:6px;}
  body.edit-mode .block{outline:1px dashed var(--gold);}
  .edit-toolbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:10px;margin-bottom:14px;
  }
  .edit-toolbar .import-btn, .edit-toolbar #exportExcelBtn{
    background:var(--accent2);color:#fff;border:none;border-radius:8px;
    padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;
  }
  .edit-toolbar #exportExcelBtn{background:var(--gold);}
  .edit-hint{font-size:12px;color:#888;}
  table.price-table{
    width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;
    margin-bottom:10px;
  }
  table.price-table th{
    background:var(--ink);color:#fff;padding:8px;font-size:13px;text-align:center;
  }
  table.price-table td{
    border-bottom:1px solid var(--line);padding:6px;text-align:center;
  }
  table.price-table input{
    width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:13px;
    text-align:center;
  }
  table.price-table .code-input{text-align:right;font-weight:700;}
  table.price-table .row-del{
    background:#c0392b;color:#fff;border:none;border-radius:6px;
    width:28px;height:28px;cursor:pointer;font-size:13px;
  }
  .add-row-btn{
    display:block;margin:0 auto 20px;background:var(--accent2);color:#fff;border:none;
    padding:9px 18px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;
  }
  #exportCanvas{padding:16px;background:#fff;}
  .exp-block{border:1px solid #333;padding:6px;margin-bottom:8px;border-radius:4px;}
  .exp-header{font-weight:800;border-bottom:2px solid var(--accent);margin-bottom:10px;padding-bottom:6px;}
</style>
</head>

<header>
  <h1>📋 فيروز</h1>
  <div class="totals">
    <span>القطع: <b id="totalPieces">0</b></span>
    <span>المبلغ: <b id="totalAmount">0</b></span>
  </div>
  <button id="editBtn" onclick="toggleEditMode()" style="background:#a8863b;color:#fff;border:none;padding:7px 12px;border-radius:7px;font-weight:700;font-size:12px;cursor:pointer;">✎ تعديل الأسعار</button>
  <button id="cloudBtn" onclick="openCloudSettings()" style="background:#666;color:#fff;border:none;padding:7px 12px;border-radius:7px;font-weight:700;font-size:12px;cursor:pointer;" title="السحابة غير مفعلة">☁️ سحابة</button>
</header>

<div class="tabs" id="tabs"></div>
<div class="customer-bar">
  <input id="customerName" placeholder="✏️ اسم الزبون">
</div>
<div class="search-bar"><input id="searchBox" placeholder="ابحث بالكود... مثال: LMM, GT, NG"></div>

<main id="main"></main>

<footer class="bar">
  <button class="btn-clear" onclick="clearAll()">مسح الكل</button>
  <button class="btn-export" onclick="exportOrder()">📤 تصدير الطلبية</button>
</footer>

let DATA = loadData();

function mergeSavedData(saved){
  // Keep the user's saved data, but restore any old/default brand whose
  // product list was accidentally saved empty by an earlier version.
  const result = JSON.parse(JSON.stringify(DEFAULT_DATA));
  if(saved && typeof saved === "object"){
    Object.keys(saved).forEach(brand=>{
      if(Array.isArray(saved[brand]) && saved[brand].length){
        result[brand] = saved[brand];
      }else if(!(brand in result)){
        result[brand] = [];
      }
    });
  }
  return result;
}
function loadData(){
  try{
    const savedRaw = localStorage.getItem(LS_DATA_KEY);
    if(savedRaw) return mergeSavedData(JSON.parse(savedRaw));
  }catch(e){
    console.warn("تعذر قراءة بيانات المنتجات المحفوظة:", e);
  }
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function saveData(){
  try{
    localStorage.setItem(LS_DATA_KEY, JSON.stringify(DATA));
  }catch(e){
    console.warn("تحذير: مساحة التخزين المحلي ممتلئة، احفظ البيانات بالسحابة", e);
  }
  scheduleCloudPush();
}
function loadQty(){
  try{
    const saved = localStorage.getItem(LS_QTY_KEY);
    if(saved) return JSON.parse(saved);
  }catch(e){}
  return {};
}
function saveQty(){
  try{
    localStorage.setItem(LS_QTY_KEY, JSON.stringify(QTY));
  }catch(e){
    console.warn("تحذير: مساحة التخزين المحلي ممتلئة", e);
  }
  scheduleCloudPush();
}

  مزامنة تلقائية عبر Firebase Realtime Database (REST, مجاني 1GB)
  المتجر يكتب ويقرأ بلا حساب: الرابط نفسه هو المفتاح السري.
============================================== */
const LS_CLOUD_KEY = "orderapp_cloud_v1";

let cloudCfg = null;

let cloudTimer = null;

let cloudToken = null;
try{ cloudCfg = JSON.parse(localStorage.getItem(LS_CLOUD_KEY)||"null"); }catch(e){ cloudCfg = null; }

function cloudBase(){
  if(!cloudCfg) return "";
  return cloudCfg.url.replace(/\/+$/,"") + "/" + ((cloudCfg.room||"shop1")+"");
}

// Firebase Anonymous Auth: يجلب رمز أمان يتجدد تلقائياً، ببدونه القواعد ترفض أي قراءة/كتابة.
async function ensureToken(force){
  if(cloudToken && !force && Date.now() < cloudToken.expiry) return cloudToken.id;
  const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_API_KEY}`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({returnSecureToken:true})
  });
  if(!res.ok) throw new Error("auth failed " + res.status);
  const j = await res.json();
  cloudToken = { id: j.idToken, expiry: Date.now() + ((parseInt(j.expiresIn||"3600",10) - 120) * 1000) };
  return cloudToken.id;
}

async function httpJson(method, path, body, retried){
  const tok = await ensureToken();
  const res = await fetch(`${cloudBase()}/${path}.json?auth=${encodeURIComponent(tok)}`, {
    method,
    headers: body!==undefined ? {"Content-Type":"application/json"} : undefined,
    body: body!==undefined ? JSON.stringify(body) : undefined
  });
  if(res.status === 401 && !retried){
    cloudToken = null;
    return httpJson(method, path, body, true);
  }
  if(!res.ok) throw new Error(method+" "+res.status+" "+ (await res.text().catch(()=>"")));
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}

function cloudUi(){
  const btn = document.getElementById("cloudBtn");
  const st = document.getElementById("cloudStatusText");
  if(btn){
    btn.style.background = cloudStatus==="on" ? "#1e7a3c" : (cloudStatus==="error" ? "#b02a1d" : "#666");
    btn.title = cloudStatus==="on" ? "السحابة متصلة ✓" : (cloudStatus==="error" ? "تعذر الاتصال بالسحابة" : "السحابة غير مفعلة");
  }
  if(st){
    st.textContent = cloudStatus==="on" ? "✓ متصل — المزامنة تعمل تلقائياً"
      : cloudStatus==="connecting" ? "جاري الاتصال…"
      : cloudStatus==="error" ? "✗ فشل الاتصال — تأكد من الرابط أو أعد الضغط على حفظ والاتصال"
      : "غير متصل — البيانات محفوظة على هذا الجهاز فقط";
    st.className = "cloud-status" + (cloudStatus==="on" ? " on" : (cloudStatus==="error" ? " error" : ""));
  }
}

async function cloudPull(){
  if(!cloudCfg) return;
  cloudStatus = "connecting"; cloudUi();
  try{
    cloudSupress = true;
    const [p,q,c] = await Promise.all([
      httpJson("GET","products"),
      httpJson("GET","qty"),
      httpJson("GET","customer")
    ]);
    if(p && typeof p==="object"){
      DATA = mergeSavedData(p);
      normalizeAllProducts();
      saveData();
    }
    if(q && typeof q==="object"){ QTY = decodeQty(q); saveQty(); }
    if(typeof c === "string"){
      const ci = document.getElementById("customerName");
      if(ci) ci.value = c;
      localStorage.setItem(LS_CUSTOMER_KEY, c);
    }
    buildTabs();
    buildPanels();
    updateTotals();
    cloudSupress = false;
    cloudStatus = "on"; cloudUi();
    scheduleCloudPush();
  }catch(e){
    cloudSupress = false;
    cloudStatus = "error"; cloudUi();
    console.warn("سحب من السحابة فشل:", e);
  }
}

function encodeQty(q){
  const out = {};
  Object.entries(q||{}).forEach(([brand, codes])=>{
    const b = encodeURIComponent(brand);
    out[b] = {};
    Object.entries(codes||{}).forEach(([code, items])=>{
      out[b][encodeURIComponent(code)] = items;
    });
  });
  return out;
}
function decodeQty(q){
  const out = {};
  Object.entries(q||{}).forEach(([brand, codes])=>{
    let b = brand;
    try{ b = decodeURIComponent(brand); }catch(e){}
    out[b] = {};
    Object.entries(codes||{}).forEach(([code, items])=>{
      let c = code;
      try{ c = decodeURIComponent(code); }catch(e){}
      out[b][c] = items;
    });
  });
  return out;
}

async function cloudPushAll(){
  const hasQty = Object.keys(QTY).length > 0;
  await Promise.all([
    httpJson("PUT","products",DATA),
    httpJson("PUT","qty", hasQty ? encodeQty(QTY) : null),
    httpJson("PUT","customer",document.getElementById("customerName").value),
    httpJson("PUT","updatedAt",Date.now())
  ]);
}

function scheduleCloudPush(){
  if(!cloudCfg || cloudSupress) return;
  cloudDirty = true;
  if(cloudTimer) clearTimeout(cloudTimer);
  cloudTimer = setTimeout(async ()=>{
    cloudTimer = null;
    if(!cloudDirty || !cloudCfg) return;
    cloudDirty = false;
    try{
      await cloudPushAll();
      cloudStatus = "on"; cloudUi();
    }catch(e){
      cloudStatus = "error"; cloudUi();
      console.warn("رفع للسحابة فشل:", e);
    }
  }, 1800);
}

function parsePrices(priceStr){
  if(!priceStr || priceStr.trim()==="-") return {big:0, small:0};
  const parts = priceStr.split("/").map(s=>{
    // Source sheet uses "." as a THOUSANDS separator (e.g. 15.000 = 15000), not decimal.
    const clean = s.trim().replace(/,/g,"").replace(/\./g,"");
    return parseFloat(clean);
  });
  const valid = parts.filter(n=>!isNaN(n));
  if(!valid.length) return {big:0, small:0};
  return { big: Math.max(...valid), small: Math.min(...valid) };
}
function fmt(n){
  if(!n) return "0";
  return n.toLocaleString("en-US", {maximumFractionDigits:3});
}

const EAN_L = ["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
const EAN_G = ["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"];
const EAN_R = ["1110010","1100110","1101100","1000010","1011100","1001110","1010000","1000100","1001000","1110100"];
const EAN_PARITY = ["AAAAAA","AABABB","AABBAB","AABBBA","ABAABB","ABBAAB","ABBBAA","ABABAB","ABABBA","ABBABA"];

function ean13Check(d12){
  let s = 0;
  for(let i=0;i<12;i++) s += (i%2===0) ? parseInt(d12[i],10) : parseInt(d12[i],10)*3;
  return (10 - (s%10)) % 10;
}

function renderBarcode(svg, value){
  if(!svg) return;
  const NS = "http://www.w3.org/2000/svg";
  svg.innerHTML = "";
  svg.style.display = "none";
  const w = parseFloat(svg.getAttribute("width")||svg.style.width||105)||105;
  const h = parseFloat(svg.getAttribute("height")||svg.style.height||34)||34;
  const v = String(value||"").trim();
  if(!v) return;
  if(!/^[0-9]+$/.test(v)){
    svg.style.display = "block";
    const t = document.createElementNS(NS,"text");
    t.setAttribute("x", w/2);
    t.setAttribute("y", h/2+4);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("font-family","monospace");
    t.setAttribute("font-size", Math.min(11, h*0.4));
    t.textContent = v.length>16 ? v.slice(0,16) : v;
    svg.appendChild(t);
    return;
  }
  let bits = "", text = "";
  if(v.length === 12 || v.length === 13){
    const d = v.length===12 ? v : v.slice(0,12);
    const check = v.length===13 ? v[12] : String(ean13Check(d));
    text = d + check;
    const par = EAN_PARITY[parseInt(d[0],10)];
    bits = "00000000000" + "101";
    for(let i=1;i<=6;i++) bits += (par[i-1]==="A" ? EAN_L : EAN_G)[parseInt(d[i],10)];
    bits += "01010";
    for(let i=7;i<12;i++) bits += EAN_R[parseInt(d[i],10)];
    bits += EAN_R[parseInt(check,10)] + "101" + "00000000000";
  } else {
    let d = v;
    if(d.length % 2) d = "0" + d;
    const ITF = ["nnwwn","wnnnw","nwnnw","wwnnn","nnwnw","wnwnn","nwwnn","nnnww","wnnwn","nwnwn"];
    bits = "0000000000";
    for(let i=0;i<d.length;i+=2){
      const b = ITF[parseInt(d[i],10)], s = ITF[parseInt(d[i+1],10)];
      for(let j=0;j<5;j++){ bits += b[j]==="w" ? "111" : "1"; bits += s[j]==="w" ? "000" : "0"; }
    }
    bits += "11101" + "0000000000";
  }
  const mw = w / bits.length;
  const barH = h - (text ? 13 : 2);
  svg.style.display = "block";
  let run = 0;
  for(let i=0;i<bits.length;i++){
    if(bits[i]==="1"){ run++; continue; }
    if(run){
      const r = document.createElementNS(NS,"rect");
      r.setAttribute("x", (i-run)*mw);
      r.setAttribute("y", 1);
      r.setAttribute("width", run*mw);
      r.setAttribute("height", barH);
      r.setAttribute("fill","#000");
      svg.appendChild(r);
      run = 0;
    }
  }
  if(run){
    const r = document.createElementNS(NS,"rect");
    r.setAttribute("x", (bits.length-run)*mw);
    r.setAttribute("y", 1);
    r.setAttribute("width", run*mw);
    r.setAttribute("height", barH);
    r.setAttribute("fill","#000");
    svg.appendChild(r);
  }
  if(text){
    const t = document.createElementNS(NS,"text");
    t.setAttribute("x", w/2);
    t.setAttribute("y", h-3);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("font-size", 9);
    t.setAttribute("font-family","monospace");
    t.textContent = text;
    svg.appendChild(t);
  }
}

function chooseProductImage(brand, block, onDone){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.style.display = "none";

  input.addEventListener("change", ()=>{
    const file = input.files && input.files[0];
    if(!file) return;

    // Resize before saving to localStorage so product images don't consume excessive space.
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxSize = 700;
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        block.image = canvas.toDataURL("image/jpeg", 0.78);
        saveData();
        if(onDone) onDone();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  document.body.appendChild(input);
  input.click();
  setTimeout(()=>input.remove(), 1000);
}

    `;
    const rows = el.querySelector(".rows");

    if(editMode){

      if(imgBtn){
        imgBtn.addEventListener("click", ()=>{
          chooseProductImage(brand, block, ()=>buildPanels());
        });
      }
      const img = el.querySelector(".product-image");
      if(img){
        img.onclick = (e)=>{
          e.preventDefault();
          e.stopPropagation();
          if(editMode){
            chooseProductImage(brand, block, ()=>buildPanels());
          } else {
            showProductImage(img.src);
          }
        };
      }
    }

    block.items.forEach(item=>{
      const row = document.createElement("div");
      row.className = "row-item";
      const savedQty = QTY[brand][block.code][item] || 0;
      const hasVariantImg = !!getVariantImage(block, item);
      row.innerHTML = `<label class="variant-label${hasVariantImg?' has-image':''}">${item}</label><div class="qty-ctrl"><button type="button" class="btn-dec">−</button><input type="number" min="0" inputmode="numeric" placeholder="0" value="${savedQty>0?savedQty:''}"><button type="button" class="btn-inc">+</button></div>`;
      const input = row.querySelector("input");
      if(savedQty>0) row.classList.add("filled");

      const labelEl = row.querySelector(".variant-label");
      labelEl.addEventListener("click", ()=>{
        const src = getVariantImage(block, item);
        if(src) showProductImage(src);
      });

      const applyChange = ()=>{
        const val = parseInt(input.value)||0;
        if(val>0){
          QTY[brand][block.code][item] = val;
          row.classList.add("filled");
        } else {
          delete QTY[brand][block.code][item];
          row.classList.remove("filled");
        }
        el.classList.toggle("has-qty", Object.keys(QTY[brand][block.code]).length>0);
        saveQty();
        updateTotals();
      };
      input.addEventListener("input", applyChange);
      row.querySelector(".btn-inc").addEventListener("click", ()=>{
        input.value = (parseInt(input.value)||0) + 1;
        applyChange();
      });
      row.querySelector(".btn-dec").addEventListener("click", ()=>{
        const v = (parseInt(input.value)||0) - 1;
        input.value = v > 0 ? v : "";
        applyChange();
      });
      rows.appendChild(row);
    });
    if(Object.keys(QTY[brand][block.code]).length>0){
      el.classList.add("has-qty");
    }
    grid.appendChild(el);
  });
}

function handleImportExcel(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const wb = XLSX.read(ev.target.result, {type:"array"});
      wb.SheetNames.forEach(sheetName=>{
        const brand = Object.keys(DATA).find(b=>b.toLowerCase()===sheetName.toLowerCase()) || sheetName;
        if(!DATA[brand]) DATA[brand] = [];
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1});
        rows.slice(1).forEach(row=>{ // skip header row
          const [code, jumla, mfrad] = row;
          if(!code) return;
          const codeStr = String(code).trim();
          const s = parseFloat(jumla)||0;
          const b = parseFloat(mfrad)||0;
          const existing = DATA[brand].find(bl=>bl.code.toLowerCase()===codeStr.toLowerCase());
          if(existing){
            existing.price = `${b}/${s}`;
          } else {
            DATA[brand].push({code: codeStr, price:`${b}/${s}`, items:["-"]});
          }
        });
      });
      saveData();
      buildTabs();
      buildPanels();
      alert("تم الاستيراد بنجاح ✅");
    }catch(err){
      alert("صار خطأ بالاستيراد، تأكد من شكل ملف الاكسل");
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = "";
}

function exportExcel(){
  const wb = XLSX.utils.book_new();
  Object.entries(DATA).forEach(([brand, blocks])=>{
    const aoa = [["الكود","مبلغ الجملة","مبلغ المفرد"]];
    blocks.forEach(b=>{
      const {big, small} = parsePrices(b.price);
      aoa.push([b.code, small, big]);
    });
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, brand.slice(0,31));
  });
  XLSX.writeFile(wb, `products_${Date.now()}.xlsx`);
}

function updateTotals(){
  let pieces=0, amount=0;
  Object.entries(QTY).forEach(([brand, codes])=>{
    Object.entries(codes).forEach(([code, items])=>{
      const block = (DATA[brand]||[]).find(b=>b.code===code);
      const price = block ? parsePrices(block.price).small : 0;
      Object.values(items).forEach(qty=>{
        pieces += qty;
        amount += qty * price;
      });
    });
  });
  document.getElementById("totalPieces").textContent = pieces;
  document.getElementById("totalAmount").textContent = fmt(amount);
}

function clearAll(){
  if(!confirm("متأكد تريد تمسح كل الطلبية؟")) return;
  QTY = {};
  saveQty();
  buildPanels();
}

// SEARCH
document.getElementById("searchBox").addEventListener("input", (e)=>{
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".block").forEach(b=>{
    b.style.display = (!q || b.dataset.code.includes(q)) ? "" : "none";
  });
  document.querySelectorAll("table.price-table tbody tr").forEach(tr=>{
    const codeInput = tr.querySelector(".code-input");
    const code = codeInput ? codeInput.value.toLowerCase() : "";
    tr.style.display = (!q || code.includes(q)) ? "" : "none";
  });
});

// EXPORT
async function exportOrder(){
  const hasAny = Object.values(QTY).some(b=>Object.values(b).some(c=>Object.keys(c).length>0));
  if(!hasAny){ alert("ما فيه اي كمية مدخلة للطلبية"); return; }

  const container = document.createElement("div");
  container.id = "exportCanvas";
  container.style.width = "800px";
  container.style.fontFamily = "Tahoma, sans-serif";
  container.style.direction = "rtl";

  const customerName = document.getElementById("customerName").value.trim();
  let html = `<h2 style="text-align:center;border-bottom:3px solid #b5442e;padding-bottom:10px;">طلبية - ${new Date().toLocaleDateString('ar-IQ')}</h2>`;
  if(customerName){
    html += `<h3 style="text-align:center;color:#2f6b52;margin-top:-6px;">الزبون: ${customerName}</h3>`;
  }

  Object.entries(QTY).forEach(([brand, codes])=>{
    const entries = Object.entries(codes).filter(([c,items])=>Object.keys(items).length>0);
    if(!entries.length) return;
    html += `<div class="exp-header" style="margin-top:14px;">${brand}</div>`;
    html += `<table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px;">
      <tr style="background:#f1ede3;"><th style="border:1px solid #ccc;padding:4px;">الصورة / الباركود</th><th style="border:1px solid #ccc;padding:4px;">الكود</th><th style="border:1px solid #ccc;padding:4px;">الدرجة</th><th style="border:1px solid #ccc;padding:4px;">الكمية</th><th style="border:1px solid #ccc;padding:4px;">السعر</th><th style="border:1px solid #ccc;padding:4px;">المجموع</th></tr>`;
    entries.forEach(([code, items])=>{
      const block = (DATA[brand]||[]).find(b=>b.code===code);
      const price = block ? parsePrices(block.price).small : 0;
      Object.entries(items).forEach(([label, qty])=>{
        html += `<tr>
          <td style="border:1px solid #ccc;padding:4px;text-align:center;">${block && block.image ? `<img src="${block.image}" style="width:38px;height:38px;object-fit:contain;border-radius:4px;">` : "📦"}${block && block.barcode ? `<svg class="invoice-barcode" data-barcode="${block.barcode}" style="width:105px;height:34px;display:block;margin:3px auto 0;"></svg>` : ""}</td>
          <td style="border:1px solid #ccc;padding:4px;text-align:center;">${code}</td>
          <td style="border:1px solid #ccc;padding:4px;text-align:center;">${label}</td>
          <td style="border:1px solid #ccc;padding:4px;text-align:center;">${qty}</td>
          <td style="border:1px solid #ccc;padding:4px;text-align:center;">${fmt(price)}</td>
          <td style="border:1px solid #ccc;padding:4px;text-align:center;">${fmt(qty*price)}</td>
        </tr>`;
      });
    });
    html += `</table>`;
  });

  html += `<h3 style="text-align:left;border-top:2px solid #333;padding-top:8px;">الإجمالي: ${document.getElementById("totalAmount").textContent} | القطع: ${document.getElementById("totalPieces").textContent}</h3>`;

  container.innerHTML = html;
  container.querySelectorAll(".invoice-barcode").forEach(svg=>{
    renderBarcode(svg, svg.getAttribute("data-barcode"));
  });
  container.style.position = "fixed";
  container.style.left = "-9999px";
  document.body.appendChild(container);

  const canvas = await html2canvas(container, {scale:2, backgroundColor:"#ffffff"});
  document.body.removeChild(container);

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:"mm", format:"a4"});
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const imgWidth = pageWidth;
  const imgHeight = (canvas.height * imgWidth) / canvas.width;
  const imgData = canvas.toDataURL("image/png");

  let heightLeft = imgHeight;
  let position = 0;

  pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
  heightLeft -= pageHeight;

  while(heightLeft > 0){
    position = heightLeft - imgHeight;
    pdf.addPage();
    pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
  }

  const safeName = customerName ? customerName.replace(/[^a-zA-Z0-9ء-ي_ -]/g,"").trim().replace(/\s+/g,"_") : "";
  pdf.save(`order_${safeName ? safeName+"_" : ""}${Date.now()}.pdf`);
}

normalizeAllProducts();
buildTabs();
buildPanels();
updateTotals();
initCloud();

// Prevent pinch-zoom and double-tap zoom
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("gesturechange", e => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if(now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, {passive:false});
document.addEventListener("touchmove", e => {
  if(e.touches.length > 1) e.preventDefault();
}, {passive:false});
</script>
