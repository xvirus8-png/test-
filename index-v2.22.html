  .splash{position:fixed;inset:0;z-index:999;background:linear-gradient(135deg,#e0f7fa,#b2ebf2,#c8e6c9,#e0f7fa);background-size:400% 400%;animation:splashAurora 8s ease infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s ease;}

const APP_VERSION = "2.22";
window.onerror = function(msg, src, line){

};
/* ================= DATA MODEL =================
Each product block:
{ brand, code, prices:[{qtyTier, price}], items:[itemLabel,...] }
Prices shown as they appear on sheet (two numbers = two price tiers depending on order qty; we just display them as reference).
============================================== */
const DEFAULT_DATA = {

// PRODUCT FILTERS (custom named groups of codes per brand, e.g. "عارضه 50")
// FILTERS[brand] = [{id, name, codes:[...], sub:[{id, name, codes:[...]}]}]
const LS_FILTERS_KEY = "orderapp_filters_v1";
let FILTERS = loadFilters();
let ACTIVE_FILTER = {}; // brand -> filterId currently shown in the normal (non-edit) view
let ACTIVE_SUB = {};   // brand -> subFilterId (active sub-filter, if any)

function loadFilters(){
  try{
    const raw = localStorage.getItem(LS_FILTERS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === "object") return parsed;
    }
  }catch(e){}
  return {};
}
function saveFilters(){
  try{ localStorage.setItem(LS_FILTERS_KEY, JSON.stringify(FILTERS)); }
  catch(e){ console.warn("تعذر حفظ الفلاتر محلياً", e); }
  scheduleCloudPush();
}
function ensureFilters(brand){
  if(!Array.isArray(FILTERS[brand])) FILTERS[brand] = [];
  FILTERS[brand].forEach(f=>{
    if(!Array.isArray(f.sub)) f.sub = [];
    if(!Array.isArray(f.order)) f.order = [];
    f.sub.forEach(s=>{ if(!Array.isArray(s.codes)) s.codes = []; if(!Array.isArray(s.order)) s.order = []; });
  });
  return FILTERS[brand];
}
function findFilterById(brand, filterId){
  const list = ensureFilters(brand);
  for(const f of list){
    if(f.id === filterId) return {parent: null, filter: f};
    if(Array.isArray(f.sub)){
      for(const s of f.sub){
        if(s.id === filterId) return {parent: f, filter: s};
      }
    }
  }
  return null;
}

// NAFED (out of stock) — NAFED[brand][code][item] = true | NAFED[brand][code] = true (no variants)
const LS_NAFED_KEY = "orderapp_nafed_v1";
const NAFED_PIN = "2004";
let NAFED = loadNafed();
function loadNafed(){try{var r=localStorage.getItem(LS_NAFED_KEY);if(r){var p=JSON.parse(r);if(p&&typeof p==="object")return p;}}catch(e){}return {};}
function saveNafed(){try{localStorage.setItem(LS_NAFED_KEY,JSON.stringify(NAFED));}catch(e){}scheduleCloudPush();}
function isNafed(brand,code,item){
  var b=NAFED[brand];
  if(!b) return false;
  if(item){
    var c=b[code];
    if(c && typeof c==="object" && c[item]) return true;
    if(item==="-" && c===true) return true;
    return false;
  }
  return b[code]===true;
}
function setNafed(brand,code,item,on){
  if(!NAFED[brand]) NAFED[brand]={};
  if(item && item!=="-"){
    if(!NAFED[brand][code]||typeof NAFED[brand][code]!=="object") NAFED[brand][code]={};
    if(on) NAFED[brand][code][item]=true; else delete NAFED[brand][code][item];
    if(Object.keys(NAFED[brand][code]).length===0) delete NAFED[brand][code];
  }else{
    if(on) NAFED[brand][code]=true; else delete NAFED[brand][code];
  }
  if(Object.keys(NAFED[brand]).length===0) delete NAFED[brand];
  saveNafed();
}

function mergeSavedData(saved){
  // Keep the user's saved data, but restore any old/default brand whose
  // product list was accidentally saved empty by an earlier version.
  const result = JSON.parse(JSON.stringify(DEFAULT_DATA));
  if(saved && typeof saved === "object"){
    Object.keys(saved).forEach(brand=>{
      if(Array.isArray(saved[brand]) && saved[brand].length){
        result[brand] = saved[brand];
      }else if(!(brand in result)){
        result[brand] = [];
      }
    });
  }
  return result;
}
function loadData(){
  try{
    const savedRaw = localStorage.getItem(LS_DATA_KEY);
    if(savedRaw) return mergeSavedData(JSON.parse(savedRaw));
  }catch(e){
    console.warn("تعذر قراءة بيانات المنتجات المحفوظة:", e);
  }
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}

}

// Firebase Anonymous Auth: يجلب رمز أمان يتجدد تلقائياً، ببدونه القواعد ترفض أي قراءة/كتابة.
async function ensureToken(force){
  if(cloudToken && !force && Date.now() < cloudToken.expiry) return cloudToken.id;
  const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_API_KEY}`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({returnSecureToken:true})
  });
  if(!res.ok) throw new Error("auth failed " + res.status);
  const j = await res.json();
  cloudToken = { id: j.idToken, expiry: Date.now() + ((parseInt(j.expiresIn||"3600",10) - 120) * 1000) };
  return cloudToken.id;
}

async function httpJson(method, path, body, retried){
  const tok = await ensureToken();
  const res = await fetch(`${cloudBase()}/${path}.json?auth=${encodeURIComponent(tok)}`, {
    method,
    headers: body!==undefined ? {"Content-Type":"application/json"} : undefined,
    body: body!==undefined ? JSON.stringify(body) : undefined
  });
  if(res.status === 401 && !retried){
    cloudToken = null;
    return httpJson(method, path, body, true);
  }
  if(!res.ok) throw new Error(method+" "+res.status+" "+ (await res.text().catch(()=>"")));
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}

async function cloudPull(){
  if(!cloudCfg) return;
  cloudStatus = "connecting"; cloudUi();
  try{
    cloudSupress = true;
    const p = await httpJson("GET","products");
    if(p && typeof p==="object"){
      DATA = mergeSavedData(p);
      normalizeAllProducts();
      saveData();
    }
    const f = await httpJson("GET","filters");
    if(f && typeof f==="object"){
      FILTERS = f;
      saveFilters();
    }
    const n = await httpJson("GET","nafed");
    if(n && typeof n==="object"){
      NAFED = n;
      try{localStorage.setItem(LS_NAFED_KEY,JSON.stringify(NAFED));}catch(e){}
    }
    buildTabs();
    buildPanels();
    updateTotals();
    cloudSupress = false;
    cloudStatus = "on"; cloudUi();
    hideSplash();
    scheduleCloudPush();
  }catch(e){
    cloudSupress = false;
    cloudStatus = "error"; cloudUi();
    hideSplash();
    console.warn("سحب من السحابة فشل:", e);
  }
}

function encodeQty(q){
  const out = {};
  Object.entries(q||{}).forEach(([brand, codes])=>{
    const b = encodeURIComponent(brand);
    out[b] = {};
    Object.entries(codes||{}).forEach(([code, items])=>{
      out[b][encodeURIComponent(code)] = items;
    });
  });
  return out;
}
function decodeQty(q){
  const out = {};
  Object.entries(q||{}).forEach(([brand, codes])=>{
    let b = brand;
    try{ b = decodeURIComponent(brand); }catch(e){}
    out[b] = {};
    Object.entries(codes||{}).forEach(([code, items])=>{
      let c = code;
      try{ c = decodeURIComponent(code); }catch(e){}
      out[b][c] = items;
    });
  });
  return out;
}

async function cloudPushAll(){
  await Promise.all([
    httpJson("PUT","products",DATA),
    httpJson("PUT","filters",FILTERS),
    httpJson("PUT","nafed",NAFED),
    httpJson("PUT","customer",null),
    httpJson("PUT","updatedAt",Date.now())
  ]);
}

function scheduleCloudPush(){
  if(!cloudCfg || cloudSupress) return;
  cloudDirty = true;
  if(cloudTimer) clearTimeout(cloudTimer);
  cloudTimer = setTimeout(async ()=>{
    cloudTimer = null;
    if(!cloudDirty || !cloudCfg) return;
    cloudDirty = false;
    try{
      await cloudPushAll();
      cloudStatus = "on"; cloudUi();
    }catch(e){
      cloudStatus = "error"; cloudUi();
      console.warn("رفع للسحابة فشل:", e);
    }
  }, 1800);
}

function parsePrices(priceStr){
  if(!priceStr || priceStr.trim()==="-") return {big:0, small:0};
  const parts = priceStr.split("/").map(s=>{
    // Source sheet uses "." as a THOUSANDS separator (e.g. 15.000 = 15000), not decimal.
    const clean = s.trim().replace(/,/g,"").replace(/\./g,"");
    return parseFloat(clean);
  });
  const valid = parts.filter(n=>!isNaN(n));
  if(!valid.length) return {big:0, small:0};
  return { big: Math.max(...valid), small: Math.min(...valid) };
}
function fmt(n){
  if(!n) return "0";
  return n.toLocaleString("en-US", {maximumFractionDigits:3});
}
// iPhone/Arabic keyboards emit Arabic-Indic (٠-٩) or Persian (۰-۹) digits which
// parseInt() rejects — normalize any input to plain Latin digits before use.
function normDigits(v){
  return String(v==null?"":v)
    .replace(/[٠-٩]/g, d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
    .replace(/[۰-۹]/g, d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/[^0-9]/g,"");
}

function buildTabs(){
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  Object.keys(DATA).forEach((brand,i)=>{
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (i===0?" active":"");
    btn.textContent = brand;
    btn.dataset.brand = brand;
    let longPressTimer = null;
    let didLongPress = false;
    btn.addEventListener("pointerdown", ()=>{
      didLongPress = false;
      longPressTimer = setTimeout(()=>{ didLongPress = true; openTabFilterDropdown(brand, btn); }, 450);
    });
    btn.addEventListener("pointerup", ()=>clearTimeout(longPressTimer));
    btn.addEventListener("pointercancel", ()=>clearTimeout(longPressTimer));
    btn.addEventListener("pointerleave", ()=>clearTimeout(longPressTimer));
    btn.addEventListener("click", (e)=>{
      if(didLongPress){ e.preventDefault(); e.stopPropagation(); return; }
      switchTab(brand);
    });
    tabsEl.appendChild(btn);
  });
}

function switchTab(brand){

  document.querySelectorAll(".brand-panel").forEach(p=>p.classList.toggle("active", p.dataset.brand===brand));

}

    toolbar.className = "edit-toolbar";
    toolbar.innerHTML = `
      <button type="button" class="edit-end-btn" onclick="toggleEditMode()"><i class="bi bi-check2-circle"></i> إنهاء التعديل</button>
      <span class="edit-hint">عدّل الاسم / مبلغ الجملة / مبلغ المفرد مباشرة بالجدول، ورتب المنتجات من عمود "الترتيب"</span>
    `;
    main.appendChild(toolbar);
  }

  if(filterMode){
    const toolbar = document.createElement("div");
    toolbar.className = "edit-toolbar";
    toolbar.innerHTML = `
      <button type="button" class="edit-end-btn" onclick="toggleFilterMode()"><i class="bi bi-check2-circle"></i> إنهاء</button>
      <span class="edit-hint">إدارة فلاتر العرض — أضف فلتر وحدد المنتجات اللي تريدها فيه</span>
    `;
    main.appendChild(toolbar);
  }

  Object.entries(DATA).forEach(([brand, blocks])=>{
    if(!QTY[brand]) QTY[brand] = {};
    const panel = document.createElement("div");
    panel.className = "brand-panel" + (brand===activeBrand?" active":"");
    panel.dataset.brand = brand;
    main.appendChild(panel);

    if(editMode){
      buildEditTable(panel, brand);
    } else if(filterMode){
      buildFilterPanel(panel, brand);
    } else {
      const brandFilters = ensureFilters(brand);
      panel.innerHTML = `<div class="brand-title">${brand}</div><div class="grid" id="grid-${brand}"></div>`;
      buildGrid(panel.querySelector(".grid"), brand, blocks);
      const current = ACTIVE_FILTER[brand] || "";
      if(!brandFilters.some(f=>f.id===current)) ACTIVE_FILTER[brand] = "";
      applyFilterToGrid(panel, brand, ACTIVE_FILTER[brand] || "");
    }
  });
  updateTotals();
  updateFilterBadge();
}


function normalizeProductBlock(block){
  if(!block) return block;
  const parsed = parsePrices(block.price || "");
  block.big = Number(block.big || parsed.big || 0);
  block.small = Number(block.small || parsed.small || 0);
  block.image = block.image || "";
  if(!Array.isArray(block.items) || !block.items.length) block.items = ["-"];
  if(!block.itemImages || typeof block.itemImages !== "object") block.itemImages = {};
  if(!block.itemBarcodes || typeof block.itemBarcodes !== "object") block.itemBarcodes = {};
  return block;
}

// ===== PRODUCT CARD ORDERING (edit mode: move-to-position input + up/down arrows) =====
// Array order in DATA[brand] IS the display order for both the normal grid and the edit table.
// Moving a product just splices it to a new index in that same array.
function moveBlockToIndex(brand, fromIdx, toIdx){
  const arr = DATA[brand];
  if(!Array.isArray(arr)) return;
  toIdx = Math.max(0, Math.min(arr.length-1, toIdx));
  if(toIdx === fromIdx) return;
  const [item] = arr.splice(fromIdx, 1);
  arr.splice(toIdx, 0, item);
  saveData();
  buildPanels();
}
function swapBlocks(brand, idxA, idxB){
  const arr = DATA[brand];
  if(!Array.isArray(arr) || idxB<0 || idxB>=arr.length) return;
  [arr[idxA], arr[idxB]] = [arr[idxB], arr[idxA]];
  saveData();
  buildPanels();
}

// ===== PRODUCT FILTERS (custom named groups, e.g. "عارضه 50") =====
function applyFilterToGrid(panel, brand, filterId){
  const grid = panel.querySelector(".grid");
  if(!grid) return;
  if(!filterId){
    grid.querySelectorAll(".block").forEach(b=>{ b.style.display = ""; });
    return;
  }
  const found = findFilterById(brand, filterId);
  if(!found){ grid.querySelectorAll(".block").forEach(b=>{ b.style.display = ""; }); return; }
  const codes = found.filter.codes || [];
  const codeSet = new Set(codes.map(c=>String(c).toLowerCase()));
  grid.querySelectorAll(".block").forEach(b=>{
    b.style.display = codeSet.has(b.dataset.code) ? "" : "none";
  });
  const order = found.filter.order || [];
  if(order.length){
    const blockMap = {};
    grid.querySelectorAll(".block").forEach(b=>{ blockMap[b.dataset.code] = b; });
    const ordered = new Set();
    order.forEach(code=>{
      const key = String(code).toLowerCase();
      const el = blockMap[key];
      if(el && codeSet.has(key)){ grid.appendChild(el); ordered.add(key); }
    });
    grid.querySelectorAll(".block").forEach(b=>{
      if(!ordered.has(b.dataset.code) && codeSet.has(b.dataset.code)) grid.appendChild(b);
    });
  }
}

function openTabFilterDropdown(brand, tabBtn){
  document.querySelectorAll(".filter-dropdown").forEach(d=>d.remove());
  const brandFilters = ensureFilters(brand);
  const dd = document.createElement("div");
  dd.className = "filter-dropdown";
  const currentParent = ACTIVE_FILTER[brand] || "";
  const currentSub = ACTIVE_SUB[brand] || "";
  const allItem = document.createElement("div");
  allItem.className = "filter-dropdown-item" + (!currentParent ? " active" : "");
  allItem.innerHTML = `<span>كل المنتجات</span>`;
  allItem.addEventListener("click", ()=>{
    ACTIVE_FILTER[brand] = "";
    ACTIVE_SUB[brand] = "";
    const panel = document.querySelector(`.brand-panel[data-brand="${brand}"]`);
    if(panel) applyFilterToGrid(panel, brand, "");
    updateFilterBadge();
    dd.remove();
  });
  dd.appendChild(allItem);
  brandFilters.forEach(f=>{
    const hasSub = Array.isArray(f.sub) && f.sub.length > 0;
    const isActive = (f.id === currentParent && !currentSub) || (currentSub && f.sub?.some(s=>s.id===currentSub));
    const item = document.createElement("div");
    item.className = "filter-dropdown-item" + (isActive ? " active" : "");
    item.innerHTML = `<span>${escHtml(f.name)}${hasSub ? " ▸" : ""}</span><span class="fd-count">${f.codes.length} منتج</span>`;
    item.addEventListener("click", ()=>{
      if(hasSub){
        dd.remove();
        openSubFilterDropdown(brand, tabBtn, f);
      } else {
        ACTIVE_FILTER[brand] = f.id;
        ACTIVE_SUB[brand] = "";
        const panel = document.querySelector(`.brand-panel[data-brand="${brand}"]`);
        if(panel) applyFilterToGrid(panel, brand, f.id);
        updateFilterBadge();
        dd.remove();
      }
    });
    dd.appendChild(item);
  });
  document.body.appendChild(dd);
  const rect = tabBtn.getBoundingClientRect();
  dd.style.top = (rect.bottom + 4) + "px";
  dd.style.right = Math.max(8, window.innerWidth - rect.right) + "px";
  const closeDD = (e)=>{
    if(!dd.contains(e.target) && e.target !== tabBtn){ dd.remove(); document.removeEventListener("pointerdown", closeDD); }
  };
  setTimeout(()=>document.addEventListener("pointerdown", closeDD), 0);
}

function updateFilterBadge(){
  const badge = document.getElementById("filterBadge");

  const activePanel = document.querySelector(".brand-panel.active");
  if(!activePanel){ badge.classList.remove("visible"); return; }
  const brand = activePanel.dataset.brand;
  const filterId = ACTIVE_FILTER[brand] || "";

  if(!filterId){ badge.classList.remove("visible"); return; }

// ===== FULL-PAGE FILTER MANAGEMENT (filterMode) =====
function buildFilterPanel(panel, brand){
  const list = ensureFilters(brand);
  const allProducts = Array.isArray(DATA[brand]) ? DATA[brand] : [];
  let currentView = "list"; // list | sub | products | subProducts
  let currentFilterId = null;
  let currentSubId = null;

  function render(){
    if(currentView === "list") renderList();
    else if(currentView === "sub") renderSubList();
    else if(currentView === "products") renderProducts();
    else if(currentView === "subProducts") renderSubProducts();
  }

  function renderList(){
    const listNow = ensureFilters(brand);
    panel.innerHTML = `
      <div class="brand-title">🏷️ فلاتر ${escHtml(brand)}</div>
      <div class="filter-page-search"><input type="search" class="fp-search-input" placeholder="🔍 ابحث عن فلتر…" id="fpSearchInput"></div>
      <div class="filter-page-list" id="fpList"></div>
      <div class="filter-page-add">
        <input type="text" class="new-filter-input" placeholder="اسم الفلتر الجديد… مثلاً عارضه 50" id="fpAddInput">
        <button type="button" class="new-filter-btn" id="fpAddBtn">+ إضافة</button>
      </div>
    `;
    const listEl = panel.querySelector("#fpList");
    if(!listNow.length){
      listEl.innerHTML = `<div class="history-empty">ماكو فلاتر بعد.<br>سوي فلتر جديد وضيفله المنتجات اللي تريدها 🗂</div>`;
    } else {
      listNow.forEach(f=>{
        const subCount = Array.isArray(f.sub) ? f.sub.length : 0;
        const row = document.createElement("div");
        row.className = "fm-row";
        row.dataset.name = f.name.toLowerCase();
        row.innerHTML = `
          <span class="fm-name">${escHtml(f.name)}${subCount ? ` <small style="color:var(--subtext)">(${subCount} فرعية)</small>` : ""}</span>
          <span class="fm-count">${f.codes.length} منتج</span>
          <button type="button" class="fm-sub" title="الفلاتر الفرعية">📁</button>
          <button type="button" class="fm-open">✏ المنتجات</button>
          <button type="button" class="fm-del">🗑</button>
        `;
        const nameEl = row.querySelector(".fm-name");
        let lpTimer = null;
        let didLongPress = false;
        nameEl.addEventListener("pointerdown", ()=>{
          didLongPress = false;
          lpTimer = setTimeout(()=>{ didLongPress = true; const newName = prompt("اسم الفلتر الجديد:", f.name); if(newName && newName.trim() !== "" && newName.trim() !== f.name){ f.name = newName.trim(); saveFilters(); render(); } }, 450);
        });
        nameEl.addEventListener("pointerup", ()=>clearTimeout(lpTimer));
        nameEl.addEventListener("pointercancel", ()=>clearTimeout(lpTimer));
        nameEl.addEventListener("pointerleave", ()=>clearTimeout(lpTimer));
        nameEl.addEventListener("click", (e)=>{
          if(didLongPress){ e.preventDefault(); e.stopPropagation(); return; }
        });
        row.querySelector(".fm-sub").addEventListener("click", ()=>{ currentView = "sub"; currentFilterId = f.id; render(); });
        row.querySelector(".fm-open").addEventListener("click", ()=>{ currentView = "products"; currentFilterId = f.id; render(); });
        row.querySelector(".fm-del").addEventListener("click", ()=>{
          if(!confirm(`حذف فلتر "${f.name}"؟`)) return;
          FILTERS[brand] = ensureFilters(brand).filter(x=>x.id!==f.id);
          saveFilters();
          render();
        });
        listEl.appendChild(row);
      });
    }
    const searchInput = panel.querySelector("#fpSearchInput");
    searchInput.addEventListener("input", ()=>{
      const q = searchInput.value.trim().toLowerCase();
      panel.querySelectorAll("#fpList .fm-row").forEach(row=>{
        if(!row.dataset.name) return;
        row.style.display = (!q || row.dataset.name.includes(q)) ? "" : "none";
      });
    });
    const input = panel.querySelector("#fpAddInput");
    const addBtn = panel.querySelector("#fpAddBtn");
    const doAdd = ()=>{
      const name = input.value.trim();
      if(!name) return;
      ensureFilters(brand).push({id: "f" + Date.now(), name, codes: [], sub: []});
      saveFilters();
      input.value = "";
      render();
    };
    addBtn.addEventListener("click", doAdd);
    input.addEventListener("keydown", (e)=>{ if(e.key === "Enter") doAdd(); });
  }

  function renderSubList(){
    const listNow = ensureFilters(brand);
    const parent = listNow.find(x=>x.id===currentFilterId);
    if(!parent){ currentView = "list"; render(); return; }
    if(!Array.isArray(parent.sub)) parent.sub = [];
    panel.innerHTML = `
      <div class="brand-title">📁 ${escHtml(parent.name)} — فرعيات</div>
      <div class="filter-page-search"><input type="search" class="fp-search-input" placeholder="🔍 ابحث عن فلتر فرعي…" id="fpSearchInput"></div>
      <div class="filter-page-list" id="fpList"></div>
      <div class="filter-page-add">
        <input type="text" class="new-filter-input" placeholder="اسم الفلتر الفرعي…" id="fpAddInput">
        <button type="button" class="new-filter-btn" id="fpAddBtn">+ إضافة</button>
      </div>
    `;
    const backRow = document.createElement("div");
    backRow.className = "fm-row";
    backRow.innerHTML = `<button type="button" class="fm-back">→ رجوع للفلاتر</button>`;
    backRow.querySelector(".fm-back").addEventListener("click", ()=>{ currentView = "list"; render(); });
    panel.querySelector("#fpList").appendChild(backRow);
    parent.sub.forEach(s=>{
      const row = document.createElement("div");
      row.className = "fm-row";
      row.dataset.name = s.name.toLowerCase();
      row.innerHTML = `
        <span class="fm-name">${escHtml(s.name)}</span>
        <span class="fm-count">${s.codes.length} منتج</span>
        <button type="button" class="fm-open">✏ المنتجات</button>
        <button type="button" class="fm-del">🗑</button>
      `;
      const nameEl = row.querySelector(".fm-name");
      let lpTimer = null;
      let didLongPress = false;
      nameEl.addEventListener("pointerdown", ()=>{
        didLongPress = false;
        lpTimer = setTimeout(()=>{ didLongPress = true; const newName = prompt("اسم الفلتر الفرعي:", s.name); if(newName && newName.trim() !== "" && newName.trim() !== s.name){ s.name = newName.trim(); saveFilters(); render(); } }, 450);
      });
      nameEl.addEventListener("pointerup", ()=>clearTimeout(lpTimer));
      nameEl.addEventListener("pointercancel", ()=>clearTimeout(lpTimer));
      nameEl.addEventListener("pointerleave", ()=>clearTimeout(lpTimer));
      nameEl.addEventListener("click", (e)=>{ if(didLongPress){ e.preventDefault(); e.stopPropagation(); return; } });
      row.querySelector(".fm-open").addEventListener("click", ()=>{ currentView = "subProducts"; currentFilterId = parent.id; currentSubId = s.id; render(); });
      row.querySelector(".fm-del").addEventListener("click", ()=>{
        if(!confirm(`حذف الفلتر الفرعي "${s.name}"؟`)) return;
        parent.sub = parent.sub.filter(x=>x.id!==s.id);
        saveFilters();
        render();
      });
      panel.querySelector("#fpList").appendChild(row);
    });
    const searchInput = panel.querySelector("#fpSearchInput");
    searchInput.addEventListener("input", ()=>{
      const q = searchInput.value.trim().toLowerCase();
      panel.querySelectorAll("#fpList .fm-row").forEach(row=>{
        if(!row.dataset.name) return;
        row.style.display = (!q || row.dataset.name.includes(q)) ? "" : "none";
      });
    });
    const input = panel.querySelector("#fpAddInput");
    const addBtn = panel.querySelector("#fpAddBtn");
    const doAdd = ()=>{
      const name = input.value.trim();
      if(!name) return;
      parent.sub.push({id: "sf" + Date.now(), name, codes: []});
      saveFilters();
      input.value = "";
      render();
    };
    addBtn.addEventListener("click", doAdd);
    input.addEventListener("keydown", (e)=>{ if(e.key === "Enter") doAdd(); });
  }

  function renderProducts(){
    const listNow = ensureFilters(brand);
    const filter = listNow.find(x=>x.id===currentFilterId);
    if(!filter){ currentView = "list"; render(); return; }
    if(!Array.isArray(filter.codes)) filter.codes = [];
    if(!Array.isArray(filter.order)) filter.order = [];
    const codeSet = new Set(filter.codes.map(c=>String(c).toLowerCase()));
    panel.innerHTML = `
      <div class="brand-title">✏ ${escHtml(filter.name)} — المنتجات</div>
      <div class="filter-page-list" id="fpList"></div>
      <div class="filter-page-add"><button type="button" class="new-filter-btn" id="fpDoneBtn">✅ تم</button></div>
    `;
    const backRow = document.createElement("div");
    backRow.className = "fm-row";
    backRow.innerHTML = `<button type="button" class="fm-back">→ رجوع للفلاتر</button>`;
    backRow.querySelector(".fm-back").addEventListener("click", ()=>{ currentView = "list"; render(); });
    panel.querySelector("#fpList").appendChild(backRow);
    const included = allProducts.filter(bl=>codeSet.has(bl.code.toLowerCase()));
    const excluded = allProducts.filter(bl=>!codeSet.has(bl.code.toLowerCase()));
    const ordered = included.sort((a,b)=>{
      const ai = filter.order.findIndex(c=>c.toLowerCase()===a.code.toLowerCase());
      const bi = filter.order.findIndex(c=>c.toLowerCase()===b.code.toLowerCase());
      return (ai>=0?ai:99999) - (bi>=0?bi:99999);
    });
    [...ordered, ...excluded].forEach(block=>{
      const isIn = codeSet.has(block.code.toLowerCase());
      const row = document.createElement("div");
      row.className = "fm-check-row";
      const cid = "fpchk_" + Math.random().toString(36).slice(2);
      const orderBtns = isIn ? `<span class="fm-order-btns"><button type="button" class="fm-ou" data-code="${block.code}" title="أعلى">▲</button><button type="button" class="fm-od" data-code="${block.code}" title="أسفل">▼</button></span>` : "";
      row.innerHTML = `<input type="checkbox" id="${cid}" ${isIn?"checked":""}><label for="${cid}">${escHtml(block.code)}</label>${orderBtns}`;
      row.querySelector("input").addEventListener("change", (e)=>{
        if(e.target.checked){
          if(!filter.codes.some(c=>c.toLowerCase()===block.code.toLowerCase())) filter.codes.push(block.code);
          codeSet.add(block.code.toLowerCase());
        } else {
          filter.codes = filter.codes.filter(c=>c.toLowerCase()!==block.code.toLowerCase());
          filter.order = filter.order.filter(c=>c.toLowerCase()!==block.code.toLowerCase());
          codeSet.delete(block.code.toLowerCase());
        }
        saveFilters();
        render();
      });
      panel.querySelector("#fpList").appendChild(row);
    });
    panel.querySelectorAll(".fm-ou").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const code = btn.dataset.code;
        const idx = filter.order.findIndex(c=>c.toLowerCase()===code.toLowerCase());
        if(idx > 0){
          [filter.order[idx-1], filter.order[idx]] = [filter.order[idx], filter.order[idx-1]];
          saveFilters();
          render();
        }
      });
    });
    panel.querySelectorAll(".fm-od").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const code = btn.dataset.code;
        const idx = filter.order.findIndex(c=>c.toLowerCase()===code.toLowerCase());
        if(idx >= 0 && idx < filter.order.length - 1){
          [filter.order[idx], filter.order[idx+1]] = [filter.order[idx+1], filter.order[idx]];
          saveFilters();
          render();
        }
      });
    });

  function renderSubProducts(){
    const listNow = ensureFilters(brand);
    const parent = listNow.find(x=>x.id===currentFilterId);
    if(!parent){ currentView = "list"; render(); return; }
    const sub = parent.sub.find(x=>x.id===currentSubId);
    if(!sub){ currentView = "sub"; render(); return; }
    if(!Array.isArray(sub.codes)) sub.codes = [];
    if(!Array.isArray(sub.order)) sub.order = [];
    const codeSet = new Set(sub.codes.map(c=>String(c).toLowerCase()));
    panel.innerHTML = `

    const included = allProducts.filter(bl=>codeSet.has(bl.code.toLowerCase()));
    const excluded = allProducts.filter(bl=>!codeSet.has(bl.code.toLowerCase()));
    const ordered = included.sort((a,b)=>{
      const ai = sub.order.findIndex(c=>c.toLowerCase()===a.code.toLowerCase());
      const bi = sub.order.findIndex(c=>c.toLowerCase()===b.code.toLowerCase());
      return (ai>=0?ai:99999) - (bi>=0?bi:99999);
    });
    [...ordered, ...excluded].forEach(block=>{

      const row = document.createElement("div");

      row.innerHTML = `<input type="checkbox" id="${cid}" ${isIn?"checked":""}><label for="${cid}">${escHtml(block.code)}</label>${orderBtns}`;
      row.querySelector("input").addEventListener("change", (e)=>{
        if(e.target.checked){
          if(!sub.codes.some(c=>c.toLowerCase()===block.code.toLowerCase())) sub.codes.push(block.code);
          codeSet.add(block.code.toLowerCase());
        } else {
          sub.codes = sub.codes.filter(c=>c.toLowerCase()!==block.code.toLowerCase());
          sub.order = sub.order.filter(c=>c.toLowerCase()!==block.code.toLowerCase());
          codeSet.delete(block.code.toLowerCase());
        }
        saveFilters();
        render();
      });
      panel.querySelector("#fpList").appendChild(row);
    });
    panel.querySelectorAll(".fm-ou").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const code = btn.dataset.code;
        const idx = sub.order.findIndex(c=>c.toLowerCase()===code.toLowerCase());
        if(idx > 0){
          [sub.order[idx-1], sub.order[idx]] = [sub.order[idx], sub.order[idx-1]];

          render();
        }
      });

    panel.querySelectorAll(".fm-od").forEach(btn=>{

const EAN_L = ["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
const EAN_G = ["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"];
const EAN_R = ["1110010","1100110","1101100","1000010","1011100","1001110","1010000","1000100","1001000","1110100"];
const EAN_PARITY = ["AAAAAA","AABABB","AABBAB","AABBBA","ABAABB","ABBAAB","ABBBAA","ABABAB","ABABBA","ABBABA"];

function ean13Check(d12){
  let s = 0;
  for(let i=0;i<12;i++) s += (i%2===0) ? parseInt(d12[i],10) : parseInt(d12[i],10)*3;
  return (10 - (s%10)) % 10;
}

function renderBarcode(svg, value){
  if(!svg) return;
  const NS = "http://www.w3.org/2000/svg";
  svg.innerHTML = "";
  svg.setAttribute("fill","currentColor");
  svg.style.display = "none";
  const w = parseFloat(svg.getAttribute("width")||svg.style.width||105)||105;
  const h = parseFloat(svg.getAttribute("height")||svg.style.height||34)||34;
  const v = String(value||"").trim();
  if(!v) return;
  if(!/^[0-9]+$/.test(v)){
    svg.style.display = "block";
    const t = document.createElementNS(NS,"text");
    t.setAttribute("x", w/2);
    t.setAttribute("y", h/2+4);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("font-family","monospace");
    t.setAttribute("font-size", Math.min(11, h*0.4));
    t.textContent = v.length>16 ? v.slice(0,16) : v;
    svg.appendChild(t);
    return;
  }
  let bits = "", text = "";
  if(v.length === 12 || v.length === 13){
    const d = v.length===12 ? v : v.slice(0,12);
    const check = v.length===13 ? v[12] : String(ean13Check(d));
    text = d + check;
    const par = EAN_PARITY[parseInt(d[0],10)];
    bits = "00000000000" + "101";
    for(let i=1;i<=6;i++) bits += (par[i-1]==="A" ? EAN_L : EAN_G)[parseInt(d[i],10)];
    bits += "01010";
    for(let i=7;i<12;i++) bits += EAN_R[parseInt(d[i],10)];
    bits += EAN_R[parseInt(check,10)] + "101" + "00000000000";
  } else {
    let d = v;
    if(d.length % 2) d = "0" + d;
    const ITF = ["nnwwn","wnnnw","nwnnw","wwnnn","nnwnw","wnwnn","nwwnn","nnnww","wnnwn","nwnwn"];
    bits = "0000000000";
    for(let i=0;i<d.length;i+=2){
      const b = ITF[parseInt(d[i],10)], s = ITF[parseInt(d[i+1],10)];
      for(let j=0;j<5;j++){ bits += b[j]==="w" ? "111" : "1"; bits += s[j]==="w" ? "000" : "0"; }
    }
    bits += "11101" + "0000000000";
  }
  const mw = w / bits.length;
  const barH = h - (text ? 13 : 2);
  svg.style.display = "block";
  let run = 0;
  for(let i=0;i<bits.length;i++){
    if(bits[i]==="1"){ run++; continue; }
    if(run){
      const r = document.createElementNS(NS,"rect");
      r.setAttribute("x", (i-run)*mw);
      r.setAttribute("y", 1);
      r.setAttribute("width", run*mw);
      r.setAttribute("height", barH);
      r.setAttribute("fill","#000");
      svg.appendChild(r);
      run = 0;
    }
  }
  if(run){
    const r = document.createElementNS(NS,"rect");
    r.setAttribute("x", (bits.length-run)*mw);
    r.setAttribute("y", 1);
    r.setAttribute("width", run*mw);
    r.setAttribute("height", barH);
    r.setAttribute("fill","#000");
    svg.appendChild(r);
  }
  if(text){
    const t = document.createElementNS(NS,"text");
    t.setAttribute("x", w/2);
    t.setAttribute("y", h-3);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("font-size", 9);

function chooseProductImage(brand, block, onDone){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.style.display = "none";

  input.addEventListener("change", ()=>{
    const file = input.files && input.files[0];
    if(!file) return;

    // Resize before saving to localStorage so product images don't consume excessive space.
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxSize = 700;
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        block.image = canvas.toDataURL("image/jpeg", 0.78);
        saveData();
        if(onDone) onDone();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  document.body.appendChild(input);
  input.click();
  setTimeout(()=>input.remove(), 1000);
}

function escHtml(s){

function codeHasRealQty(obj){

}
// press-and-hold auto-repeat: fires fn immediately, then repeats every 90ms after 450ms hold
function attachHoldRepeat(btn, fn){
  let hold = null, rep = null;
  const stop = ()=>{
    if(hold){ clearTimeout(hold); hold = null; }
    if(rep){ clearInterval(rep); rep = null; }
  };
  btn.addEventListener("pointerdown", (e)=>{
    if(e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    try{ btn.setPointerCapture(e.pointerId); }catch(err){}
    fn();
    hold = setTimeout(()=>{ rep = setInterval(fn, 90); }, 450);
  });
  ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>btn.addEventListener(ev, stop));
}

        });
      }

      if(img){
        img.onclick = (e)=>{
          e.preventDefault();
          e.stopPropagation();
          if(editMode){
            chooseProductImage(brand, block, ()=>buildPanels());
          } else {
            showProductImage(img.src);
          }
        };
      }
    }

    block.items.forEach(item=>{
      const row = document.createElement("div");
      row.className = "row-item";
      const savedQty = QTY[brand][block.code][item] || 0;
      const hasVariantImg = !!getVariantImage(block, item);
      const noteVal = typeof QTY[brand][block.code][item+"::N"] === "string" ? QTY[brand][block.code][item+"::N"] : "";
      const itemNafed = isNafed(brand, block.code, item);
      if(itemNafed){
        row.classList.add("nafed-row-item");
        row.innerHTML = '<label class="variant-label">'+escHtml(item)+'</label><div class="qty-side"><span class="meta-badges"><span class="meta-badge" style="background:var(--danger);">نافذ</span></span></div>';
      } else {
        row.innerHTML = '<label class="variant-label'+(hasVariantImg?' has-image':'')+'">'+escHtml(item)+'</label><div class="qty-side"><span class="meta-badges"></span><div class="qty-ctrl"><button type="button" class="add-extra-btn" title="تيستر / هدية / ملاحظة"><i class="bi bi-tag"></i></button><button type="button" class="btn-dec">−</button><input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="'+(savedQty>0?savedQty:'')+'"><button type="button" class="btn-inc">+</button></div><div class="row-note'+(noteVal?' has':'')+'">'+(noteVal?"📝 "+escHtml(noteVal):"")+'</div></div>';
        const input = row.querySelector("input");
        if(savedQty>0) row.classList.add("filled");
        input.addEventListener("focus", ()=>{
          try{ input.select(); }catch(err){}
          requestAnimationFrame(()=>{ try{ input.select(); }catch(err){} });
        });
        const applyChange = ()=>{
          const val = parseInt(normDigits(input.value))||0;
          if(val>0){
            QTY[brand][block.code][item] = val;
            row.classList.add("filled");
          } else {
            delete QTY[brand][block.code][item];
            row.classList.remove("filled");
          }
          el.classList.toggle("has-qty", codeHasRealQty(QTY[brand][block.code]));
          saveQty();
          updateTotals();
        };
        input.addEventListener("input", ()=>{
          const clean = normDigits(input.value);
          if(clean !== input.value) input.value = clean;
          applyChange();
        });
        attachHoldRepeat(row.querySelector(".btn-inc"), ()=>{
          input.value = (parseInt(normDigits(input.value))||0) + 1;
          applyChange();
        });
        attachHoldRepeat(row.querySelector(".btn-dec"), ()=>{
          const v = (parseInt(normDigits(input.value))||0) - 1;
          input.value = v > 0 ? v : "";
          applyChange();
        });
        row.querySelector(".add-extra-btn").addEventListener("click", ()=>{
          openExtraMenu(brand, block.code, item, row);
        });
      }
      const labelEl = row.querySelector(".variant-label");
      labelEl.addEventListener("click", ()=>{
        if(itemNafed) return;
        const src = getVariantImage(block, item);
        if(src) showProductImage(src);
      });
      if(!itemNafed) refreshRowExtras(row, brand, block.code, item);
      rows.appendChild(row);
    });
    if(codeHasRealQty(QTY[brand][block.code])){
      el.classList.add("has-qty");
    }
    grid.appendChild(el);
  });
}

function openExtraMenu(brand, code, item, rowEl){
  const bucket = QTY[brand][code];
  const overlay = document.createElement("div");
  overlay.className = "extra-menu-modal";
  const tOn = bucket[item+"::T"] > 0;
  const gOn = bucket[item+"::G"] > 0;
  overlay.innerHTML = `
    <div class="extra-menu">
      <button type="button" class="xm-opt" data-x="T">🧪 تيستر${tOn?'<span class="st">✓ مفعّل</span>':""}</button>
      <button type="button" class="xm-opt" data-x="G">🎁 هدية${gOn?'<span class="st">✓ مفعّل</span>':""}</button>
      <button type="button" class="xm-opt" data-x="N">📝 ملاحظة</button>
      <button type="button" class="xm-cancel">إلغاء</button>
    </div>`;
  document.body.appendChild(overlay);
  const onKey = (e)=>{ if(e.key === "Escape") close(); };
  const close = ()=>{ overlay.remove(); document.removeEventListener("keydown", onKey); };
  overlay.addEventListener("click", (e)=>{ if(e.target === overlay) close(); });
  document.addEventListener("keydown", onKey);
  overlay.querySelector(".xm-cancel").addEventListener("click", close);
  const syncBlock = ()=>{
    const blk = rowEl.closest(".block");
    if(blk) blk.classList.toggle("has-qty", codeHasRealQty(bucket));
  };
  overlay.querySelectorAll(".xm-opt").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const x = btn.dataset.x;
      if(x === "N"){
        close();
        const res = await askNote(getNoteVal(brand, code, item));
        if(res === null) return;
        if(res){ bucket[item+"::N"] = res; } else { delete bucket[item+"::N"]; }
        saveQty();
        refreshRowExtras(rowEl, brand, code, item);
        syncBlock();
      }else{
        const key = item + "::" + x;
        if(bucket[key]){ delete bucket[key]; } else { bucket[key] = 1; }
        saveQty();
        refreshRowExtras(rowEl, brand, code, item);
        syncBlock();
        updateTotals();
        close();
      }
    });
  });
}

function askNote(current){
  return new Promise(resolve=>{
    const overlay = document.createElement("div");
    overlay.className = "variants-modal";
    overlay.innerHTML = `
      <div class="variants-panel">
        <div class="variants-panel-head">
          <div class="variants-panel-title">📝 ملاحظة على الدرجة</div>

          <button type="button" class="note-save">💾 حفظ</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const input = overlay.querySelector(".note-input");
    const done = (v)=>{ overlay.remove(); document.removeEventListener("keydown", onKey); resolve(v); };
    const onKey = (e)=>{ if(e.key === "Escape") done(null); };
    overlay.querySelector(".note-save").addEventListener("click", ()=>done(input.value.trim()));
    const delBtn = overlay.querySelector(".note-del");
    if(delBtn) delBtn.addEventListener("click", ()=>done(""));
    overlay.querySelector(".close-variants").addEventListener("click", ()=>done(null));

    input.addEventListener("keydown", (e)=>{ if(e.key === "Enter") overlay.querySelector(".note-save").click(); });
    document.addEventListener("keydown", onKey);
    setTimeout(()=>{ try{ input.focus(); }catch(err){} }, 60);
  });
}

function handleImportExcel(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const wb = XLSX.read(ev.target.result, {type:"array"});
      wb.SheetNames.forEach(sheetName=>{
        const brand = Object.keys(DATA).find(b=>b.toLowerCase()===sheetName.toLowerCase()) || sheetName;
        if(!DATA[brand]) DATA[brand] = [];
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1});
        rows.slice(1).forEach(row=>{ // skip header row
          const [code, jumla, mfrad] = row;
          if(!code) return;
          const codeStr = String(code).trim();
          const s = parseFloat(jumla)||0;
          const b = parseFloat(mfrad)||0;
          const existing = DATA[brand].find(bl=>bl.code.toLowerCase()===codeStr.toLowerCase());
          if(existing){
            existing.price = `${b}/${s}`;
          } else {
            DATA[brand].push({code: codeStr, price:`${b}/${s}`, items:["-"]});
          }
        });
      });
      saveData();
      buildTabs();
      buildPanels();
      alert("تم الاستيراد بنجاح ✅");

// EXPORT & PREVIEW
function hasAnyQty(qtySource){
  const src = qtySource || QTY;
  return Object.values(src).some(b=>b && Object.values(b).some(c=>c && Object.keys(c).length>0));
}
function computeTotals(qtySource){
  let pieces=0, amount=0;
  Object.entries(qtySource||{}).forEach(([brand, codes])=>{
    Object.entries(codes||{}).forEach(([code, items])=>{
      const block = (DATA[brand]||[]).find(b=>b.code===code);
      const basePrice = block ? parsePrices(block.price).small : 0;
      Object.entries(items||{}).forEach(([label, qty])=>{
        if(/::N$/.test(label)) return; // note text, never counted
        // Tester/Gift markers (::T / ::G) count as pieces but carry no price
        const isFree = /::(T|G)$/.test(label);
        pieces += qty;
        if(!isFree) amount += qty * basePrice;
      });
    });
  });
  return {pieces, amount};
}

// qtySource = snapshot of quantities to render (defaults to live QTY)
// customerName = optional name printed on the sheet header
async function renderOrderCanvas(qtySource, customerName){
  const srcQty = qtySource || QTY;
  if(!hasAnyQty(srcQty)){ alert("ما فيه اي كمية مدخلة للطلبية"); return null; }

  const container = document.createElement("div");
  container.id = "exportCanvas";
  container.style.width = "800px";
  container.style.fontFamily = "Tahoma, sans-serif";
  container.style.direction = "rtl";

  let html = `<h2 style="text-align:center;border-bottom:3px solid #b5442e;padding-bottom:10px;">طلبية - ${new Date().toLocaleDateString('ar-IQ')}</h2>`;
  if(customerName){
    html += `<h3 style="text-align:center;color:#2f6b52;margin-top:-6px;">الزبون: ${customerName}</h3>`;
  }

  Object.entries(srcQty).forEach(([brand, codes])=>{
    const entries = Object.entries(codes).filter(([c,items])=>Object.keys(items).length>0);
    if(!entries.length) return;
    html += `<div class="exp-header" style="margin-top:14px;">${brand}</div>`;
    html += `<table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px;">
      <tr style="background:#f1ede3;"><th style="border:1px solid #ccc;padding:4px;">BARCODE/PIC</th><th style="border:1px solid #ccc;padding:4px;">CODE</th><th style="border:1px solid #ccc;padding:4px;">NUM</th><th style="border:1px solid #ccc;padding:4px;">QTY</th><th style="border:1px solid #ccc;padding:4px;">PRICE</th><th style="border:1px solid #ccc;padding:4px;">TOTAL</th></tr>`;
    entries.forEach(([code, items])=>{
      const block = (DATA[brand]||[]).find(b=>b.code===code);
      const basePrice = block ? parsePrices(block.price).small : 0;
      const notes = {}, realItems = {};
      Object.entries(items).forEach(([k,v])=>{
        const nm = k.match(/^(.*)::N$/);
        if(nm){ notes[nm[1]] = String(v); } else { realItems[k] = v; }
      });
      // a note-only product still prints as its base row (qty shows –)
      Object.keys(notes).forEach(nl=>{ if(!(nl in realItems)) realItems[nl] = 0; });
      if(!Object.keys(realItems).length) return;
      Object.entries(realItems).forEach(([label, qty])=>{
        const meta = label.match(/^(.*)::(T|G)$/);
        const showLabel = meta ? `${meta[1]} · ${meta[2]==="T" ? "Tester" : "Gift"}` : label;
        const price = meta ? 0 : basePrice;
        const noteHtml = !meta && notes[label] ? `<div style="font-size:10px;color:#666;margin-top:2px;">📝 ${escHtml(notes[label])}</div>` : "";
        const variantBarcode = !meta && block && block.itemBarcodes && block.itemBarcodes[label] ? String(block.itemBarcodes[label]).trim() : "";
          html += `<tr>
          <td style="border:1px solid #ccc;padding:4px;text-align:center;">${block && block.image ? `<img src="${block.image}" style="width:38px;height:38px;object-fit:contain;border-radius:4px;">` : "📦"}${variantBarcode ? `<div style="direction:ltr;font-family:monospace;font-size:11px;font-weight:bold;color:#000;margin-top:3px;">${escHtml(variantBarcode)}</div>` : ""}</td>
          <td style="border:1px solid #ccc;padding:4px;text-align:center;">${code}</td>
          <td style="border:1px solid #ccc;padding:4px;text-align:center;">${showLabel}${noteHtml}</td>
          <td style="border:1px solid #ccc;padding:4px;text-align:center;">${qty>0?qty:"–"}</td>
          <td style="border:1px solid #ccc;padding:4px;text-align:center;">${fmt(price)}</td>
          <td style="border:1px solid #ccc;padding:4px;text-align:center;">${fmt(qty*price)}</td>
        </tr>`;
      });
    });
    html += `</table>`;
  });

  const t = computeTotals(srcQty);
  html += `<h3 style="text-align:left;border-top:2px solid #333;padding-top:8px;">الإجمالي: ${fmt(t.amount)} | القطع: ${t.pieces}</h3>`;

  container.innerHTML = html;
  container.style.position = "fixed";
  container.style.left = "-9999px";
  document.body.appendChild(container);

  const canvas = await html2canvas(container, {scale:2, backgroundColor:"#ffffff"});
  document.body.removeChild(container);
  return canvas;
}

function orderFileName(customer){
  const safeName = customer ? String(customer).replace(/[^a-zA-Z0-9ء-ي_ -]/g,"").trim().replace(/\s+/g,"_") : "";
  return `${safeName || "order"}.pdf`;
}

function buildOrderPdf(canvas){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:"mm", format:"a4"});
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const imgWidth = pageWidth;
  const imgHeight = (canvas.height * imgWidth) / canvas.width;
  const imgData = canvas.toDataURL("image/png");

  let heightLeft = imgHeight;
  let position = 0;

  pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
  heightLeft -= pageHeight;

  while(heightLeft > 0){
    position = heightLeft - imgHeight;
    pdf.addPage();
    pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
  }
  return pdf;
}

// Mandatory customer-name prompt. Resolves with the trimmed name, or null if cancelled.
function askCustomerName(prefill){
  return new Promise(resolve=>{
    const overlay = document.createElement("div");
    overlay.className = "variants-modal";
    overlay.innerHTML = `
      <div class="variants-panel">
        <div class="variants-panel-head">
          <div class="variants-panel-title"><i class="bi bi-person"></i> اسم الزبون</div>
          <button type="button" class="close-variants" aria-label="إلغاء">×</button>
        </div>
        <div class="add-item-bar" style="border-top:none;">
          <input type="text" class="custreq-input" placeholder="اكتب اسم الزبون…" autocomplete="off">
          <button type="button" class="custreq-ok">✅ تصدير</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const input = overlay.querySelector(".custreq-input");
    if(prefill) input.value = prefill;

    const done = (val)=>{
      overlay.remove();
      document.removeEventListener("keydown", onKey);
      resolve(val);
    };
    const submit = ()=>{
      const v = input.value.trim();
      if(!v){ alert("اسم الزبون مطلوب للتصدير ✍️"); input.focus(); return; }
      done(v);
    };
    const close = ()=>done(null);

    overlay.querySelector(".custreq-ok").addEventListener("click", submit);
    input.addEventListener("keydown", (e)=>{ if(e.key === "Enter") submit(); });
    overlay.querySelector(".close-variants").addEventListener("click", close);
    overlay.addEventListener("click", (e)=>{ if(e.target === overlay) close(); });
    const onKey = (e)=>{ if(e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    setTimeout(()=>{ try{ input.focus(); }catch(e){} }, 60);
  });
}

// ===== Sharing: native share sheet when available, viewer tab as fallback =====
async function shareOrderPdf(qtySource, customerName){
  const canvas = await renderOrderCanvas(qtySource, customerName);
  if(!canvas) return false;
  const pdf = buildOrderPdf(canvas);
  const blob = pdf.output("blob");
  const fname = orderFileName(customerName);
  try{
    const file = new File([blob], fname, {type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"طلبية " + (customerName||""), text:"طلبية " + (customerName||"")});
      return true; // user completed (or cancelled) the native share sheet
    }
  }catch(err){
    if(err && err.name === "AbortError") return true; // user closed the share sheet
    // fall through to viewer fallback
  }
  const win = window.open("", "_blank");
  if(win){
    const url = URL.createObjectURL(blob);
    win.location.href = url;
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }else{
    pdf.save(fname);
    alert("المتصفح منع المشاركة — تم تحميل الـ PDF بدلاً من ذلك، شاركه من ملفات الجهاز.");
  }
  return true;
}

async function shareSavedOrder(id){

}

// === BACKUP SYSTEM ===
var backups = [];
const LS_BACKUPS_KEY = "orderapp_backups_v1";
const MAX_LOCAL_BACKUPS = 15;
const MAX_CLOUD_BACKUPS = 3;
const BACKUP_PASSWORD = "1564";

function loadBackups(){
  try{ const r = localStorage.getItem(LS_BACKUPS_KEY); if(r) backups = JSON.parse(r); }catch(e){}
  backups = Array.isArray(backups) ? backups : [];
}
function saveBackups(){
  try{ localStorage.setItem(LS_BACKUPS_KEY, JSON.stringify(backups)); }catch(e){}
}
function pruneLocalBackups(){
  while(backups.length > MAX_LOCAL_BACKUPS) backups.pop();
}
async function pullCloudBackups(){
  if(!cloudCfg) return [];
  try{
    cloudSupress = true;
    var cb = await httpJson("GET","backups");
    cloudSupress = false;
    return Array.isArray(cb) ? cb : [];
  }catch(e){
    cloudSupress = false;
    return [];
  }
}
async function syncCloudBackups(){
  if(!cloudCfg || cloudSupress) return;
  try{
    cloudSupress = true;
    const cb = await httpJson("GET","backups");
    const local3 = backups.slice(0, MAX_CLOUD_BACKUPS).map(b=>({id:b.id,ts:b.ts,data:b.data,size:b.size}));
    await httpJson("PUT","backups", local3.length ? local3 : null);
    cloudSupress = false;
  }catch(e){
    cloudSupress = false;
    console.warn("syncCloudBackups فشل:", e);
  }
}
async function createBackup(){
  var cleanData = JSON.parse(JSON.stringify(DATA));
  Object.keys(cleanData).forEach(function(brand){
    cleanData[brand].forEach(function(block){
      delete block.image;
      delete block.itemImages;
    });
  });
  var payload = {
    data: cleanData,
    qty: JSON.parse(JSON.stringify(QTY)),
    filters: JSON.parse(JSON.stringify(FILTERS)),
    theme: localStorage.getItem(LS_THEME_KEY)||""
  };
  var size = JSON.stringify(payload).length;
  var b = { id: "bk_"+Date.now(), ts: Date.now(), data: payload, size: size };
  backups.unshift(b);
  pruneLocalBackups();
  saveBackups();
  syncCloudBackups().catch(function(){});
  alert("✅ تم إنشاء النسخة الاحتياطية!\nالحجم: ~" + (size/1024).toFixed(1) + " KB\n(الصور بالسحابة فقط)");
  location.reload();
}
function restoreBackup(id){
  const pw = prompt("أدخل كلمة المرور للاستعادة:");
  if(pw !== BACKUP_PASSWORD){ alert("❌ كلمة المرور خاطئة"); return; }
  if(!confirm("⚠️ راح تستبدل كل بياناتك الحالية! متأكد؟")) return;
  const b = backups.find(x=>x.id===id);
  if(!b) return;
  const d = b.data||{};
  if(d.data) localStorage.setItem(LS_DATA_KEY, JSON.stringify(d.data));
  if(d.qty) localStorage.setItem(LS_QTY_KEY, JSON.stringify(d.qty));
  if(d.filters) localStorage.setItem(LS_FILTERS_KEY, JSON.stringify(d.filters));
  if(d.theme) localStorage.setItem(LS_THEME_KEY, d.theme);
  if(d.cloud) localStorage.setItem(LS_CLOUD_KEY, JSON.stringify(d.cloud));
  alert("✅ تم الاستعادة! يرجع التطبيق.");
  location.reload();
}
function deleteBackup(id){
  if(!confirm("حذف هذي النسخة الاحتياطية؟")) return;
  backups = backups.filter(x=>x.id!==id);
  saveBackups();
  if(cloudCfg) syncCloudBackups().catch(()=>{});

}
function downloadBackup(id){
  const b = backups.find(x=>x.id===id);
  if(!b) return;
  const payload = { data: b.data, ts: b.ts, size: b.size };
  const blob = new Blob([JSON.stringify(payload)], {type:"application/json"});

}
function importBackupFile(){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json";
  input.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const imported = JSON.parse(ev.target.result);
        if(!imported || !imported.data){ alert("⚠️ الملف غير صالح — لازم نسخة احتياطية من فيروز"); return; }
        const pw = prompt("أدخل كلمة المرور للاستعادة من الملف:");
        if(pw !== BACKUP_PASSWORD){ alert("❌ كلمة المرور خاطئة"); return; }
        if(!confirm("⚠️ راح تستبدل كل بياناتك الحالية! متأكد؟")) return;
        const d = imported.data||{};
        if(d.data) localStorage.setItem(LS_DATA_KEY, JSON.stringify(d.data));

    };

}
function openBackups(){
  loadBackups();
  if(cloudCfg){
    pullCloudBackups().then(function(cb){
      if(Array.isArray(cb)){
        var localIds = {};
        backups.forEach(function(b){ localIds[b.id]=1; });
        cb.forEach(function(b){ if(b && b.id && !localIds[b.id]) backups.push(b); });
        backups.sort(function(a,b){return (b.ts||0)-(a.ts||0);});
        pruneLocalBackups();
        saveBackups();
      }
      renderBackupModal();
    }).catch(function(){ renderBackupModal(); });
  } else {
    renderBackupModal();
  }
}

        return '<div class="backup-item">'

          + '<div class="backup-date">'+dateStr+' — '+timeStr+'</div>'
          + '<div class="backup-size">'+sz+'</div>'
          + '</div>'
          + '<div class="backup-actions">'
          + (cloudCfg ? '<button class="backup-btn-cl" onclick="downloadBackup(\''+b.id+'\')" title="حمّل سحابياً (JSON)">📤</button>' : '')
          + '<button class="backup-btn-dl" onclick="downloadBackup(\''+b.id+'\')" title="حمّل ملف JSON">💾</button>'
          + '<button class="backup-btn-restore" onclick="restoreBackup(\''+b.id+'\')" title="استعادة هذه النسخة">🔄</button>'
          + '<button class="backup-btn-del" onclick="deleteBackup(\''+b.id+'\')" title="حذف">🗑</button>'
          + '</div></div>';
      }).join("");
  var overlay = document.createElement("div");
  overlay.className = "cloud-modal";
  overlay.innerHTML = '<div class="cloud-panel">'
    + '<div class="cloud-head"><span>📥 النسخ الاحتياطية</span><button type="button" class="close-cloud" aria-label="إغلاق">×</button></div>'
    + '<div class="cloud-body">'
    + '<div style="display:flex;gap:8px;">'
    + '<button type="button" style="flex:1;" onclick="createBackup()">+ إنشاء نسخة جديدة</button>'
    + '<button type="button" style="flex:1;background:var(--soft);color:var(--text);" onclick="openBackups();importBackupFile()">📂 استعادة من ملف</button>'
    + '</div>'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">'
    + '<span style="font-size:12px;font-weight:700;color:var(--subtext);">النسخ المحفوظة ('+backups.length+'/'+MAX_LOCAL_BACKUPS+')</span>'
    + '<span style="font-size:11px;color:var(--subtext);">☁️ سحابي: '+Math.min(cloud3.length, MAX_CLOUD_BACKUPS)+'/'+MAX_CLOUD_BACKUPS+'</span>'
    + '</div>'
    + '<div style="max-height:50vh;overflow-y:auto;">'+listHtml+'</div>'
    + '</div></div>';
  document.body.appendChild(overlay);
  var closeFn = function(){ overlay.remove(); };
  overlay.querySelector(".close-cloud").addEventListener("click", closeFn);
  overlay.addEventListener("click",function(e){ if(e.target===overlay) closeFn(); });
  document.addEventListener("keydown", function onKey(e){ if(e.key==="Escape"){ closeFn(); document.removeEventListener("keydown",onKey); }});
}
// === END BACKUP SYSTEM ===

normalizeAllProducts();
loadBackups();
buildTabs();
buildPanels();
updateTotals();
initCloud();
applyThemeIcon();
updateStickyOffsets();
updateHistoryCount();

// Fallback: clicking any product image always opens the enlarged image
// when not in edit mode. This also works after the cards are re-rendered.
document.addEventListener("click", (e)=>{
  const img = e.target.closest(".product-image");
  if(!img || editMode) return;
  e.preventDefault();
  e.stopPropagation();
  showProductImage(img.currentSrc || img.src);
}, true);

// THEME (dark/light)
const LS_THEME_KEY = "orderapp_theme_v1";
function applyThemeIcon(){
  const dark = document.documentElement.classList.contains("dark");
  const btn = document.getElementById("themeBtn");
  if(btn) btn.innerHTML = dark ? '<i class="bi bi-sun"></i> المظهر الفاتح' : '<i class="bi bi-moon-stars"></i> المظهر الداكن';
}
function toggleTheme(){
  const dark = document.documentElement.classList.toggle("dark");
  try{ localStorage.setItem(LS_THEME_KEY, dark ? "dark" : "light"); }catch(e){}
  applyThemeIcon();
}

// STICKY OFFSETS: real header/tabs heights so stacked bars never overlap
function updateStickyOffsets(){
  const hdr = document.querySelector("header");
  const tabs = document.querySelector(".tabs");
  const rs = document.documentElement.style;
  rs.setProperty("--hdr-h", (hdr ? hdr.offsetHeight : 56) + "px");
  rs.setProperty("--tabs-h", (tabs ? tabs.offsetHeight : 50) + "px");
}
window.addEventListener("resize", updateStickyOffsets);
window.addEventListener("orientationchange", ()=>setTimeout(updateStickyOffsets,200));
window.addEventListener("load", updateStickyOffsets);

// SIDE DRAWER
function openDrawer(){
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawerBackdrop").classList.add("show");
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("drawerBackdrop").classList.remove("show");
}

// ORDER HISTORY (saved on PDF export — new entries or updates while editing)
function loadOrders(){
  try{
    const raw = localStorage.getItem(LS_ORDERS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return [];
}
function saveOrders(){
  try{ localStorage.setItem(LS_ORDERS_KEY, JSON.stringify(ORDERS)); }
  catch(e){ console.warn("تعذر حفظ السجل محلياً", e); }
}

// EDIT MODE: when an old order is opened for editing, exporting updates the same entry
let editingOrderId = null;
function setEditingOrder(id){
  editingOrderId = id;
  updateEditBanner();
}
function updateEditBanner(){
  const banner = document.getElementById("editOrderBanner");
  if(!banner) return;
  const o = editingOrderId ? ORDERS.find(x=>x.id===editingOrderId) : null;
  if(o){
    document.getElementById("editOrderLabel").textContent = "✏️ تعدل طلبية: " + (o.customer || "بدون اسم");
    banner.style.display = "flex";
  }else{
    banner.style.display = "none";
  }
}
function cancelEditOrder(){
  setEditingOrder(null);
}

function commitOrderToLog(customerName){
  const t = computeTotals(QTY);
  let updated = false;
  if(editingOrderId){
    const o = ORDERS.find(x=>x.id===editingOrderId);
    if(o){
      o.customer = customerName;
      o.qty = JSON.parse(JSON.stringify(QTY));
      o.pieces = String(t.pieces);
      o.amount = fmt(t.amount);
      o.ts = new Date().toISOString();
      updated = true;
    }
    editingOrderId = null;
  }
  if(!updated){
    ORDERS.unshift({
      id: Date.now(),
      ts: new Date().toISOString(),
      customer: customerName,
      qty: JSON.parse(JSON.stringify(QTY)),
      pieces: String(t.pieces),
      amount: fmt(t.amount)
    });
    if(ORDERS.length > 50) ORDERS.length = 50;
  }
  saveOrders();
  updateHistoryCount();
  updateEditBanner();
  if(updated) alert("تم تحديث الطلبية نفسها بالسجل ✅");
}
function fmtOrderDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString("ar-IQ") + " • " + d.toLocaleTimeString("ar-IQ",{hour:"2-digit",minute:"2-digit"});
}
function updateHistoryCount(){
  const el = document.getElementById("historyCount");
  if(el) el.textContent = ORDERS.length ? String(ORDERS.length) : "";
}
function buildHistoryModal(){
  const wrap = document.createElement("div");
  wrap.className = "history-modal";
  wrap.id = "historyModal";
  wrap.innerHTML = `
    <div class="history-panel">
      <div class="history-panel-head">
        <div class="history-panel-title"><i class="bi bi-clock-history"></i> سجل الطلبيات</div>
        <button class="history-close" onclick="closeHistory()" title="إغلاق"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>`;
  return wrap;
}
function renderHistory(){
  let list;
  try{
    let modal = document.getElementById("historyModal");
    if(!modal){
      modal = buildHistoryModal();
      document.body.appendChild(modal);
    }
    list = modal.querySelector("#historyList");
    if(!ORDERS.length){
      list.innerHTML = `<div class="history-empty">ماكو طلبيات محفوظة بعد.<br>صدّر طلبية PDF وبتنحفظ تلقائياً هنا 📜</div>`;
      return;
    }
    list.innerHTML = "";
    ORDERS.forEach(o=>{
      const row = document.createElement("div");
      row.className = "history-row";
      row.innerHTML = `
        <div class="history-info">
          <div class="history-title">${o.customer ? o.customer : "بدون اسم"}</div>
          <div class="history-sub">${fmtOrderDate(o.ts)}<br>القطع: ${o.pieces} • المبلغ: ${o.amount}</div>
        </div>
        <div class="history-actions">
          <button class="hact-view" title="معاينة"><i class="bi bi-eye"></i></button>
          <button class="hact-open" title="فتح للتعديل"><i class="bi bi-folder2-open"></i></button>
          <button class="hact-del" title="حذف"><i class="bi bi-trash3"></i></button>
        </div>`;
      row.querySelector(".hact-view").addEventListener("click", ()=>previewSavedOrder(o.id));
      row.querySelector(".hact-open").addEventListener("click", ()=>loadOrder(o.id));
      row.querySelector(".hact-del").addEventListener("click", ()=>deleteOrder(o.id));
      list.appendChild(row);
    });
  }catch(err){
    alert("⚠️ خطأ بعرض السجل:\n" + err.message);
    if(list) list.innerHTML = `<div class="history-empty">صار خطأ بالعرض: ${err.message}</div>`;
  }
}
function openHistory(){
  closeDrawer();
  try{ renderHistory(); }
  catch(err){ alert("⚠️ خطأ بفتح السجل:\n" + err.message); }
}
function closeHistory(){
  const m = document.getElementById("historyModal");
  if(m) m.remove();
}
function loadOrder(id){
  try{
    const o = ORDERS.find(x=>x.id===id);
    if(!o) return;
    if(!confirm(`فتح طلبيه "${o.customer||"بدون اسم"}" للتعديل؟\nراح تستبدل الكميات الحالية، والتصدير الجاي يحدث نفس هذي الطلبية بالسجل.`)) return;
    QTY = JSON.parse(JSON.stringify(o.qty||{}));
    Object.keys(DATA||{}).forEach(b=>{ if(!QTY[b]) QTY[b]={}; });
    saveQty();
    setEditingOrder(id);
    buildPanels();
    closeHistory();
  }catch(err){
    alert("⚠️ خطأ بفتح الطلبية:\n" + err.message);
  }
}
function deleteOrder(id){
  try{
    if(!confirm("متأكد تريد تحذف هذي الطلبية من السجل؟")) return;
    ORDERS = ORDERS.filter(x=>x.id!==id);
    if(editingOrderId === id) editingOrderId = null;
    saveOrders();
    updateHistoryCount();
    updateEditBanner();
    renderHistory();
  }catch(err){
    alert("⚠️ خطأ بحذف الطلبية:\n" + err.message);
  }
}

// Prevent pinch-zoom and double-tap zoom
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("gesturechange", e => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  const onControl = e.target && e.target.closest && e.target.closest("button,input,a,label,select,textarea");
  if(!onControl && now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, {passive:false});
document.addEventListener("touchmove", e => {
  if(e.touches.length > 1) e.preventDefault();
}, {passive:false});
</script>
